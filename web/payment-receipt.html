<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顾客收款单</title><link rel="stylesheet" href="/sale-receipt.css"><script defer src="/payment-receipt.js"></script></head><body><main class="receipt-workspace"><header class="receipt-controls"><div><a href="/app?tab=receipts">返回收款单查询</a><h1>顾客收款单</h1><p>按原收款记录打印，不会再次登记收款。</p></div><div class="receipt-tools"><fieldset><legend>小票纸宽</legend><label><input type="radio" name="paper-width" value="58" checked> 58 毫米</label><label><input type="radio" name="paper-width" value="80"> 80 毫米</label></fieldset><button type="button" id="receipt-print" disabled>打印收款单</button></div></header><p id="receipt-status" class="receipt-screen-status" role="status" aria-live="polite">正在核对原收款记录…</p><div class="receipt-paper-stage"><article id="customer-receipt" class="customer-receipt" data-width="58" aria-label="顾客收款单" hidden></article></div><p class="receipt-print-help">请核对商品、收款金额和支付流水。系统登记收款不等于平台已自动核验到账。</p></main><style id="receipt-page-size"></style></body></html>
