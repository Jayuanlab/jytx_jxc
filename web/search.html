<!doctype html>
<html lang="zh-CN">
<head><script defer src="/page-help.js?v=20261010-clean-layout"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聚友通信城 · 综合查询</title><link rel="stylesheet" href="/search.css?v=20261010-clean-layout">
<link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout"><script src="/mobile-nav.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"></head><body>
<header><a href="/m">‹ 返回工作台</a><div><strong>综合查询</strong><button type="button" class="page-help-button" data-help-target="search-query-help">? 帮助</button><small>库存 · 串码 · 单据 · 往来</small></div></header>
<main>
<section class="panel"><form id="query">
<label>搜索内容<input name="q" type="search" autocomplete="off" placeholder="商品名称、串号、发票号码或单号"></label>
<label>查询范围<select name="scope"><option value="all">全部记录</option><option value="inventory">库存</option><option value="serials">串号追踪</option><option value="invoices">发票／单号</option><option value="sales">销售单</option><option value="receptions">接待单</option><option value="purchases">采购单</option><option value="suppliers">供应商</option><option value="movements">库存流水</option><option value="receipts">收支流水</option></select></label>
<div class="date-shortcuts" aria-label="查询日期"><span>查询时间</span><button id="search-today" type="button">今日</button><button id="search-all-dates" type="button">不限日期</button><span id="date-range-label" role="status">不限日期</span></div><details class="query-filters"><summary>更多筛选：仓库、供应商、日期</summary><div class="grid"><label>仓库<select name="warehouse" id="warehouse"><option value="">所有仓库</option></select></label><label>供应商<select name="supplier" id="supplier"><option value="">所有供应商</option></select></label><label>开始日期<input name="from" type="date"></label><label>结束日期<input name="to" type="date"></label></div></details>
<div class="query-actions"><button id="search-submit" type="submit">查询</button><button id="search-reset" type="button">清除筛选</button></div>
<div class="quick-modes" aria-label="快捷查询"><button type="button" data-search-mode="serials">串号追踪</button><button type="button" data-search-mode="invoices">发票／单号查询</button></div></form><p id="status" role="status" aria-live="polite">正在读取账套记录…</p></section>
<div id="smart"></div><div id="serial-trace"></div><div id="trace"></div><div id="results"></div><details id="vocabulary-panel" class="panel" hidden><summary>维护商品叫法与同义词</summary><div class="row"><h2>同义词组</h2><button type="button" class="page-help-button" data-help-target="search-vocabulary-help">? 帮助</button></div><form id="vocabulary-form"><input name="id" type="hidden"><label>同义词组（至少两项，用逗号或顿号分隔）<textarea name="terms" rows="2" placeholder="例如：充电线、数据线"></textarea></label><div class="grid"><button type="submit">保存同义词组</button><button id="vocabulary-cancel" type="button">取消编辑</button></div></form><p id="vocabulary-status" role="status"></p><div id="vocabulary-list"></div></details>
<template id="search-query-help" data-page-help-template="综合查询帮助"><p id="query-hint" class="hint">进入后直接显示已有记录；输入名称、编号或别名可筛选。</p><p id="query-result-hint">按当前账号权限查询已录入记录。</p><p>串号追踪显示当前状态和已登记的入库、销售、退货记录；相同尾号请逐件核对完整串号。</p><p>每类记录最多显示100条；串号与关联单据最多30组。可增加条件缩小范围。</p></template><template id="search-vocabulary-help" data-page-help-template="商品叫法与同义词帮助"><p class="hint">修改正式商品名称、简称和专属别名，请到 <a href="/app?tab=products">商品管理</a>。通用同义词组在此维护，保存后综合查询和开单选品都能使用。</p></template></main><script src="/reception-profile.js?v=20261010-clean-layout" defer></script><script src="/search.js?v=20261010-clean-layout" defer></script><script src="/search-admin.js?v=20261010-clean-layout" defer></script>
</body></html>
