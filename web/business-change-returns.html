<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业务变更退换申请单</title><link rel="stylesheet" href="/business-change-returns.css?v=20261027-closed-loop-v20"><script defer src="/business-change-returns.js?v=20261027-closed-loop-v20"></script></head><body>
<main><header><a href="/m">‹ 返回工作台</a><h1>业务变更退换申请单</h1></header>
<p id="status" role="status">正在读取门店账户…</p>
<form id="request-form"><section class="card"><div class="grid"><label>手机号<input name="customerPhone" type="tel" inputmode="numeric" maxlength="11"></label><label>移动业务编号<input name="mobileBusinessNo" maxlength="80"></label><label class="wide">涉及业务<input name="businessText" maxlength="500"></label></div></section>
<section class="card"><h2>退顾客</h2><div class="grid"><label>应退金额（元）<input name="refundAmount" type="number" min="0.01" step="0.01" inputmode="decimal" required></label><label>支付方式<select name="refundMethod" id="method" required><option value="cash">门店现金</option><option value="store-wechat">门店微信</option><option value="boss-wechat">老板微信</option></select></label><label id="wechat-wrap" hidden>门店微信账户<select name="refundAccountId" id="wechat"></select></label></div></section>
<section class="card"><h2>移动公司付款</h2><div class="grid"><label>移动结算总额（税前，元）<input name="hebaoAmount" id="hebao-amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></label><label>收款账户<select name="hebaoAccountId" id="hebao" required></select></label><label>移动业务或结算编号<input name="settlementNo" maxlength="100"></label><label>预计到账日期<input name="expectedAt" type="date"></label></div><div class="tax"><span>移动代扣税（2.5%）</span><output id="tax">—</output></div><div class="tax"><span>和包净应收</span><output id="net-receivable">—</output></div></section>
<section class="card actions"><button type="submit" name="draft" value="true" class="secondary">保存草稿</button><button type="submit" name="draft" value="false">提交老板批准</button></section></form>
<section class="card"><h2>本业务个人业绩</h2><div id="performance">实际退款和和包到账后计入；提成另行核定。</div></section>
<section class="card"><h2>申请记录</h2><div class="filter"><input id="query" type="search" placeholder="单号、手机号或业务编号" aria-label="查询申请记录"><button type="button" id="search" class="secondary">查询</button></div><div id="records" aria-live="polite"></div></section>
</main><dialog id="action-dialog"><form id="action-form"><h2 id="dialog-title"></h2><div id="dialog-fields"></div><div class="actions"><button type="button" id="cancel" class="secondary">取消</button><button type="submit">确认</button></div><p id="dialog-error" role="alert"></p></form></dialog>
</body></html>
