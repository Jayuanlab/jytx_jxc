<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#155eef"><title>销售清单 · 聚友通信城</title>
<link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout">
<link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout">
<link rel="stylesheet" href="/sales-list.css?v=20261011-horizontal-filter">
<script src="/page-help.js?v=20261010-clean-layout" defer></script>
<script src="/mobile-nav.js?v=20261010-clean-layout" defer></script>
<script src="/sales-list.js?v=20261010-sales-profit" defer></script>
</head>
<body class="sales-list-page">
<main class="sales-wrap">
<header class="sales-heading"><a href="/m" aria-label="返回工作台">‹</a><h1>销售清单</h1><button type="button" class="page-help-button" data-help-target="sales-list-help">? 帮助</button></header>
<template id="sales-list-help" data-page-help-template="销售清单使用说明">
<p>按日期时间、仓库、营业员、商品、供货商查询；搜索框也可输入商品、串号后四位、姓名或单号。清空时间后可查全部日期。</p>
<p>清单逐条显示销售商品；点“查看原单”查看原销售单，并按权限办理退换货。库存盘点从工作台单独进入；商品调价在库存查询中操作。</p>
<p>毛利按原单实际出库成本计算，扣减退货、红冲和赠品成本，并包含供应商确认的成本调整。成本缺失时显示“—”；毛利按权限显示。</p>
<p>净销量、净销售额扣掉所选原销售单截至查询时的累计退货和红冲。时间按原单开单时间筛选，与退款当天的资金流水不同。汇总包含所有查询结果，不限于当前页。赠品不计入销售金额。</p>
<p>供货商按原采购来源识别。手机逐台对应原入库单；多家供货的配件按原出库记录分摊，数量可能带小数。来源缺失时显示“来源待补”。</p>
<p>营业员只查看授权范围内的销售记录。切换门店后查询当前门店。</p>
</template>
<form id="sales-filter" class="sales-filter">
<div class="sales-shortcuts" aria-label="选择日期"><button type="button" data-period="today">今日</button><button type="button" data-period="yesterday">昨日</button><button type="button" data-period="week">近7天</button><button type="button" data-period="month">本月</button><button type="button" data-period="all">全部日期</button></div>
<div class="sales-dates"><label><span class="sales-date-name">开始<span class="sales-date-suffix">时间</span></span><input name="from" type="datetime-local" step="60" aria-label="开始时间"></label><label><span class="sales-date-name">结束<span class="sales-date-suffix">时间</span></span><input name="to" type="datetime-local" step="60" aria-label="结束时间"></label></div>
<div class="sales-filter-grid">
<label>仓库<select name="warehouse"><option value="">全部仓库</option></select></label>
<label>营业员<select name="salesperson"><option value="">全部营业员</option></select></label>
<label>商品<select name="product"><option value="">全部商品</option></select></label>
<label>供货商<select name="supplier"><option value="">全部供货商</option></select></label>
</div>
<label class="sales-search">商品 / 串号 / 单号<input name="q" type="search" maxlength="160" autocomplete="off" placeholder="名称、串号后4位、姓名或单号"></label>
<div class="sales-filter-actions"><button type="submit" class="primary">查询</button><button type="button" id="sales-reset">清空筛选</button><a href="/app?tab=inventory">库存查询 ↗</a></div>
</form>
<p id="sales-status" class="sales-status" role="status" aria-live="polite">正在加载销售清单…</p>
<section id="sales-summary" class="sales-summary" aria-label="全部查询结果汇总" hidden></section>
<nav class="sales-result-tabs" aria-label="销售清单视图"><button type="button" id="sales-lines-tab" aria-pressed="true">销售明细</button><button type="button" id="sales-suppliers-tab" aria-pressed="false">供货商销量</button></nav>
<section id="sales-lines" class="sales-lines" aria-label="销售商品明细"></section>
<nav id="sales-pager" class="sales-pager" aria-label="销售清单分页"></nav>
<section id="sales-suppliers" class="sales-suppliers" aria-label="供货商销售排名" hidden></section>
</main>
</body>
</html>
