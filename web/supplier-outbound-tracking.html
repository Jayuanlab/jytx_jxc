<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>供货商调货跟踪</title><link rel="stylesheet" href="/supplier-outbound-tracking.css"><script defer src="/supplier-outbound-tracking.js"></script></head>
<body><main>
<header><a href="/m">← 返回工作台</a><h1>供货商调货跟踪</h1></header>
<p id="message" role="status">正在读取当前账套…</p>
<section class="focus" aria-labelledby="focus-title"><h2 id="focus-title">重点追踪</h2><div id="open-summary">正在读取未闭合调货单…</div></section>
<details class="card" id="new-panel"><summary>新建调货申请</summary><form id="new-form"><div class="grid"><label>供货商<select name="supplierId" id="supplier" required></select></label><label>送到哪家店<input name="receivingStore" maxlength="100" required></label></div><label>约定备注<textarea name="agreement" maxlength="1000" required placeholder="写明供货商何时付钱或换回货；时间不明确时工作助理会提示补充"></textarea></label><div class="section-head"><h3>调出商品</h3><button type="button" id="add-line" class="link">＋ 增加商品</button></div><div id="item-lines"></div><div class="total">本单约定待结 <strong id="sum">¥0.00</strong></div><button type="submit" class="primary">提交老板批准</button></form></details>
<section class="card"><div class="section-head"><h2>调货记录</h2><button id="refresh" class="link" type="button">刷新</button></div><div id="records"></div></section>
</main><template id="item-template"><div class="item"><button class="remove" type="button" aria-label="删除此商品">×</button><div class="grid"><label>二级分类<select class="category"></select></label><label>具体型号<input class="search" type="search" placeholder="按名称或编码筛选"><select class="sku"></select></label><label>仓库与现货<select class="warehouse"></select></label><label>数量<input class="quantity" type="number" min="1" step="1" value="1" required></label><label>约定单价（元）<input class="unit" type="number" min="0.01" step="0.01" inputmode="decimal" required></label><label class="serial-wrap" hidden>实际串号（每行一个）<textarea class="serials" placeholder="手机逐台填写完整串号"></textarea></label></div></div></template>
<dialog id="action-dialog"><form id="action-form"><h2 id="action-title"></h2><div id="action-context"></div><div id="action-fields"></div><p id="action-error" role="alert"></p><div class="buttons"><button type="button" id="cancel" class="secondary">取消</button><button type="submit" class="primary">确认办理</button></div></form></dialog>
</body></html>
