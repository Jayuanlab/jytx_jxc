<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>规则记忆与连续办理</title><link rel="stylesheet" href="/search.css"><style>main{max-width:1000px;margin:auto;padding:16px}label{display:block;margin:12px 0}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;font:inherit}button{padding:10px 18px;margin:5px}article{border:1px solid #bbcddd;border-radius:12px;padding:16px;margin:12px 0;white-space:pre-wrap}a{color:#1457ac}#status{white-space:pre-wrap}form{background:#f3f8ff;padding:18px;border-radius:12px}</style><script defer src="/rule-authority-page.js?v=20261023-rule-authority-1"></script></head><body><main><a href="/m">返回工作台</a> · <a href="/brain">数字大脑</a> · <a href="/assistant?mode=store">工作助理</a><h1>规则记忆与连续办理</h1><p>工作助理与数字大脑共用老板确认的规则。金额、库存、到账情况仍实时查询原单。</p><section id="current-rules"></section><p id="status" role="status">正在读取…</p><section><h2>继续当前任务</h2><div id="task"></div></section><section><h2>询问已记住的规则</h2><form id="query"><label>您的问题<input name="question" required placeholder="例如：门店付款该用哪个账户？"></label><button>查询规则</button></form><div id="answer"></div></section><section><h2 id="form-title">提交新规则或替换提案</h2><form id="teach"><input type="hidden" name="id"><input type="hidden" name="revision"><label>固定规则主题<input name="topicKey" list="topic-options" required maxlength="100" placeholder="替换同一业务的规则时，沿用原主题"><datalist id="topic-options"></datalist></label><label>规则名称<input name="title" required maxlength="100"></label><label>规则正文<textarea name="content" required maxlength="4000" rows="4"></textarea></label><label>适用条件<textarea name="conditions" rows="2"></textarea></label><label>例外和需要人工核对的情况<textarea name="counterexample" rows="2"></textarea></label><label>生效日期<input name="effectiveFrom" type="date"></label><label>截至日期（可不填）<input name="effectiveTo" type="date"></label><label>可见范围<select name="audience"><option value="staff">本店员工</option><option value="owner">仅老板</option></select></label><label id="confirm-label"><input name="confirmed" type="checkbox" style="width:auto">我已核对规则内容，确认供助理与数字大脑使用</label><button>保存规则</button><button type="button" id="reset">新增另一条</button></form></section><section><h2>已保存的规则</h2><div id="rules"></div></section></main></body></html>
