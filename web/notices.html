<!doctype html><html lang="zh-CN"><head><script defer src="/page-help.js?v=20261010-clean-layout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>聚友通信城 · 门店消息</title><link rel="stylesheet" href="/notices.css?v=20261010-clean-layout"><link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout"><script src="/notices.js?v=20261010-clean-layout" defer></script><script src="/mobile-nav.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"></head><body><main><header><a href="/m">‹ 返回工作台</a><h1>门店消息 <button type="button" class="page-help-button" data-help-target="notices-help">? 帮助</button></h1></header><template id="notices-help" data-page-help-template="门店消息用法"><p>每笔关键单据和系统预警在这里留痕；需要处理的事项请进入首页“待我处理”。</p></template><div class="toolbar"><strong id="unread">正在加载…</strong><label for="category">查看分类</label><select id="category"><option value="all">全部消息</option><option value="cash">现金收款</option><option value="aggregate">账户分项核对</option><option value="business">其他业务</option><option value="approval">审批待办</option></select><button id="select-visible" type="button">选择本类未读</button><button id="clear-selected" type="button">取消选择</button><button id="mark-selected" type="button">批量标记已查看（0）</button><button id="refresh" type="button">刷新</button></div><p class="lead">标记已查看只清理消息提示，不确认收款、现金交接或审批。需要决定的事项仍在老板待办。</p><p id="status" role="alert"></p><section id="rows" aria-live="polite"></section><dialog id="inquiry-dialog"><form id="inquiry-form"><h2 id="inquiry-title">交营业员待查</h2><p>只安排核查，不调整现金、账户分项核对或原单金额。</p><input id="inquiry-key" type="hidden"><label>负责人<select id="inquiry-employee" required></select></label><label>具体疑点<textarea id="inquiry-reason" minlength="3" maxlength="500" required placeholder="例如：银行通知未到，请核对平台当日交易流水"></textarea></label><div class="dialog-actions"><button type="button" id="inquiry-cancel">取消</button><button type="submit" id="inquiry-submit">交给营业员待查</button></div></form></dialog></main></body></html>
