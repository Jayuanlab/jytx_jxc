<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>供货商换货单</title><link rel="stylesheet" href="/supplier-exchanges.css?v=20261027-original-in-pending-r1"><script defer src="/jsQR.js"></script><script defer src="/sale-capture.js?v=20261027-exchange-scan-r1"></script><script defer src="/supplier-exchanges.js?v=20261027-original-in-pending-r1"></script></head><body><main>
<header><a href="/m">← 返回工作台</a><h1>供货商换货单</h1></header>
<p id="message" role="status" hidden>正在读取当前账套…</p>
<section class="sheet" id="editor"><h2>新建换货申请</h2><form id="exchange-form"><div class="grid"><label>供货商<select id="supplier" name="supplierId" required></select></label><label>交货方式<select name="mode"><option>先交后收</option><option>当面交换</option></select></label></div>
<div class="section-head"><h3>换出商品</h3><button type="button" id="add-out">＋ 增加商品</button></div><div class="table-scroll"><div class="line-heading"><span>一级分类 / 二级分类</span><span>具体型号 / 仓库</span><span>数量</span><span>抵价单价（元）</span><span>金额</span><span></span></div><div id="outgoing"></div></div>
<div class="section-head"><h3>换回商品</h3><button type="button" id="add-in">＋ 增加商品</button></div><div class="table-scroll"><div class="line-heading"><span>一级分类 / 二级分类</span><span>具体型号 / 仓库</span><span>数量</span><span>入库单价（元）</span><span>金额</span><span></span></div><div id="incoming"></div></div>
<label>换货原因及约定<textarea name="agreement" maxlength="500" required placeholder="填写颜色、型号、换回时间等实际约定"></textarea></label>
<div class="totals"><span>换出抵价 <strong id="out-total">¥0.00</strong></span><span>换回金额 <strong id="in-total">¥0.00</strong></span><span id="difference-label">差价 <strong id="difference">¥0.00</strong></span></div>
<button type="submit" class="primary" id="submit">提交老板批准</button><p id="submit-result" role="status"></p></form></section>
<section class="sheet"><div class="section-head"><h2>换货记录</h2><button id="refresh" type="button">刷新</button></div><form id="filter" class="filter"><label>查询<input id="query" type="search" placeholder="单号、供货商或商品型号"></label><label>状态<select id="scope"><option value="all">全部</option><option value="open">未完成</option><option value="closed">已完成</option></select></label><button>查询</button></form><div id="records">正在读取…</div></section>
</main><template id="line-template"><div class="item-line"><div class="scan-row"><label>扫串号／商品条码<input class="scan-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="扫码枪扫码或输入完整码" aria-label="扫串号或商品条码"></label><div class="scan-buttons"><button class="scan-add" type="button">录入</button><button class="scan-camera phone-only" type="button">相机扫码</button><button class="scan-photo phone-only" type="button">拍照识码</button></div><p class="scan-state" role="status"></p><div class="scan-choices"></div></div><div class="chosen-product" hidden></div><details class="manual-product"><summary>查找商品／切换仓库</summary><div class="product-picker"><div><label>一级分类<select class="first"></select></label><label>二级分类<select class="second"></select></label></div><div><label>具体型号<input class="product-search" type="search" placeholder="名称、型号或编码"><select class="sku" aria-label="具体型号" required></select></label><label>仓库<select class="warehouse" required></select></label></div></div></details><div class="line-fields"><label>数量<input class="quantity" type="number" value="1" min="1" step="1" required></label><label class="unit-label">单价（元）<input class="unit" type="number" min="0.01" step="0.01" inputmode="decimal" required></label><div class="line-amount">¥0.00</div><button type="button" class="remove" aria-label="删除此行">×</button></div><label class="serial-field" hidden>换出完整串号<select class="serial-select" multiple aria-label="选择换出完整串号"></select><span class="hint">按实际换出数量逐台选择</span></label><label class="incoming-serial-field" hidden>换回完整串号<textarea class="incoming-serials" rows="3" placeholder="每行一个完整串号；未到货可在验收时补齐" aria-label="换回完整串号"></textarea><span class="serial-count" role="status"></span></label></div></template>
<dialog id="dialog"><form id="action-form"><h2 id="action-title"></h2><div id="action-context"></div><div id="action-fields"></div><p id="action-error" role="alert"></p><div class="buttons"><button id="cancel" type="button">取消</button><button id="action-submit" class="primary">确认办理</button></div></form></dialog><dialog id="exchange-camera-dialog" class="exchange-camera"><div class="camera-heading"><h2 id="exchange-camera-title">相机扫码</h2><button id="exchange-camera-close" type="button">关闭相机</button></div><video id="exchange-scan-video" playsinline muted autoplay></video><p id="exchange-camera-state" role="status"></p><button id="exchange-camera-photo" type="button">拍照识码</button></dialog><input id="exchange-scan-photo" type="file" accept="image/*" capture="environment" hidden></body></html>
