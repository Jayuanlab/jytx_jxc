<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空充boss · 聚友通信</title><link rel="stylesheet" href="/air-accounts.css?v=75"><script defer src="/air-accounts.js?v=75"></script><link rel="stylesheet" href="/funding-hub.css?v=20261024-r1"><script defer src="/funding-hub.js?v=20261024-r1"></script></head><body><header><a href="/m#module-finance">‹ 对账往来</a><strong>空充boss</strong><button id="refresh" type="button">刷新</button></header><main><section class="hero"><div><span>平台账面余额</span><strong id="current-balance">—</strong></div><a class="button light" href="/air-recharge">顾客充值 ↗</a></section><p id="status" role="status" aria-live="polite">正在读取…</p><section class="card" id="finance-overview"><div class="section-head"><h1>空充对账</h1><label class="date">日期<input id="date" type="date" required></label></div><div id="summary" class="stats"></div><p id="equation" class="equation"></p><label class="balance-check">平台实际余额（选填）<input id="actual-balance" type="number" min="0" step="0.01" inputmode="decimal" placeholder="填入BOSS显示的余额"><strong id="balance-result" role="status"></strong></label></section><section class="card" id="order-panel"><div class="orders-title"><h2>空充单</h2><button id="new-order" type="button" class="primary">＋ 发起空充单</button></div><p class="order-steps">营业员申请 → 老板充值 → 接收人确认 → 余额启用</p><p id="in-transit" class="status-banner"></p><div id="orders">正在读取…</div></section><section class="card" id="ledger-panel"><div class="section-head"><h2>当天明细</h2><span id="row-count"></span></div><div id="rows">正在读取…</div></section></main><dialog id="order-dialog"><form id="order-form"><h2 id="order-dialog-title"></h2><div id="order-fields" class="fields"></div><p id="order-form-status" role="status" class="bad"></p><div class="actions"><button id="close-order-dialog" type="button">取消</button><button type="submit" class="primary" id="save-order">确认</button></div></form></dialog><dialog id="reference-di
