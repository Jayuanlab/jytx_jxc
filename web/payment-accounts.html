<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收付款账户 · 聚友通信</title><link rel="stylesheet" href="/payment-accounts.css?v=20261022-existing-list"><script defer src="/payment-accounts.js?v=20261022-store-names"></script></head><body><header><a href="/app?tab=finance">‹ 返回工作台</a><h1>收付款账户</h1></header><main><p id="status" role="status"></p><section id="existing-accounts" class="card"><h2 id="accounts-title">已有收付款账户</h2><p>下面显示已经登记的账户；门店微信由门店设备使用，门店现金在抽屉；只有内部交接单经接收人本人确认收到，才记为个人实际接收。</p><div id="accounts-list"></div></section><section id="manage" class="card" hidden><p><a href="#existing-accounts">↑ 查看上方已有账户</a></p><h2 id="edit-title">新增账户</h2><form id="account-form"><input type="hidden" name="id"><div class="fields"><label>账户名称<input name="name" required maxlength="60" placeholder="例如：门店和包商户"></label><label>收付款方式<select name="channel"></select></label><label>账户核对人<select name="ownerId" required></select></label><label>状态<select name="active"><option value="true">启用</option><option value="false">停用</option></select></label><label class="wide">备注<textarea name="note" maxlength="300" placeholder="方便核对的说明，请勿填写密码"></textarea></label></div><div class="actions"><button type="submit">保存账户</button><button type="button" id="new-account">新增另一个</button></div><p id="form-error" role="alert"></p></form><p>停用后不能再选用，历史单据仍保留原账户。这里只登记门店收付款信息。</p></section></main></body></html>
