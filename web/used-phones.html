<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>二手机拍照评估</title><link rel="stylesheet" href="/staff-tasks.css?v=20261011-photo-work"><script defer src="/photo-tools.js?v=20261011-photo-work"></script><script defer src="/used-phones.js?v=20261011-photo-work"></script></head><body class="staff-task-page"><header><a href="/m">‹ 首页</a><strong>二手机拍照评估</strong><small id="who">确认身份中</small></header><main><section id="assessment-entry" class="card"><h1>拍几张，先做初步评估</h1><p class="hint">同一台手机拍正面、背面、边框，再加开机或电池信息页面，最多四张。</p><div id="photos"></div><div class="actions"><button id="analyze" class="primary" disabled>识别照片并初步评估</button><button id="new-assessment">新建评估</button></div><p id="vision-status" class="hint"></p><div id="observations" hidden></div><form id="assessment-form"><div class="fields"><label>品牌<input name="brand" maxlength="30" placeholder="例如：苹果"></label><label>型号<input name="model" maxlength="80" placeholder="照片识别后核对"></label><label>容量 / 版本<input name="storage" maxlength="40" placeholder="例如：128GB 国行"></label><label>照片成色<select name="appearance"><option value="">待确认</option><option value="A">A · 未见明显损伤</option><option value="B">B · 轻微使用痕迹</option><option value="C">C · 明显划痕或磕碰</option><option value="D">D · 可见破损</option></select></label></div><div id="estimate" class="estimate"><strong>参考价待确认</strong><p>识别型号、容量和成色后，按门店价格表计算。</p></div><details id="inspection"><summary>补充实机检查与设备信息</summary><div class="fields"><label>手机串号（选填）<input name="imei" inputmode="numeric" maxlength="15" placeholder="15位IMEI"></label><label>电池健康度（%）<input name="batteryHealth" type="number" min="0" max="100" step="1" placeholder="不清楚留空"></label><label>维修整备费（元）<input name="repairCost" type="number" min="0" max="100000" step="0.01" placeholder="确认无需整备填0"></label><label>交给谁复核<select name="reviewerId" id="reviewer"></select></label></div><div id="checks" class="fields checks"></div></details><label>评估说明 / 照片观察<textarea name="note" rows="3" maxlength="2000" placeholder="自动整理照片观察，也可补充来源、问题和待确认事项"></textarea></label><div class="actions"><button type="submit" class="primary">保存评估单，交负责人复核</button><a class="button" href="/work-journal">工作积分</a></div><p id="entry-status" role="status" aria-live="polite"></p></form></section><section id="price-policy" class="card" hidden><details><summary>门店参考价与逐项扣价</summary><p class="hint">参考售价、成色扣价、利润和风险预留由老板维护；没有依据的型号显示待报价。</p><form id="policy-form"><div id="price-rows"></div><button type="button" id="add-price">＋ 增加一个型号</button><div class="actions"><button class="primary" type="submit">保存参考价格表</button></div><p id="policy-status" role="status"></p></form></details></section><section class="card"><div class="task-head"><h2>评估记录与检查积分</h2><button id="refresh">刷新</button></div><p id="list-status" role="status"></p><div id="records"></div></section><p class="footer-note">照片先估外观；功能、账号和维修情况待实机检查。评估单复核后核定积分，实际收购另走入库流程。</p></main></body></html>
