<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>门店管理</title><link rel="stylesheet" href="/organization.css?v=20261010-capacity"><script defer src="/organization.js?v=20261010-capacity"></script><script defer src="/branch-context.js?v=20261010-capacity"></script><link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout"><script defer src="/mobile-nav.js?v=20261010-clean-layout"></script></head><body><main><header><a href="/m">首页</a><h1 id="org-title">门店管理</h1></header><section><h2>切换门店</h2><form id="switch-form"><label>当前操作的门店<select id="branch-select" required></select></label><button type="submit">进入门店</button></form><p id="org-status" role="status"></p></section><details id="create-section" hidden><summary>新增门店</summary><form id="create-form"><label>门店编号<input name="code" required maxlength="20" placeholder="如 002"></label><label>门店名称<input name="name" required maxlength="80"></label><button type="submit">建立空账套</button></form></details><details id="grant-section" hidden><summary>员工门店授权</summary><form id="grant-form"><label>员工<select id="grant-user" required></select></label><label>允许进入的门店<select id="grant-branches" multiple size="5" required></select></label><button type="submit">保存授权</button></form><p id="grant-status" role="status"></p></details><details id="report-section"><summary>跨店销售汇总</summary><form id="report-form"><label>开始日期<input id="report-from" name="from" type="date" required></label><label>结束日期<input id="report-to" name="to" type="date" required></label><button type="submit">查看</button></form><p id="report-status" role="status"></p><div id="report-rows"></div></details><details><summary>帮助</summary><p>每个门店的业务分开记录。进入门店后，销售、接待、库存、工资和助理均使用该门店账套。新门店共用企业知识资料，业务流水为空。切换前请完成当前填单。</p></details></main></body></html>
