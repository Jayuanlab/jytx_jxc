<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老板特别处理</title><link rel="stylesheet" href="/simple-daily-close.css?v=20261027-report-special-v1"><script defer src="/pending-special.js?v=20261027-v1"></script><style>main{max-width:900px}.special-row{display:block;border:1px solid #d6e1ed;border-radius:11px;margin:12px 0;padding:17px;font-weight:400}.special-row input{width:20px;height:20px;vertical-align:middle;margin-right:8px}.special-row strong{font-size:18px}.special-row p{margin:7px 0;color:#536a80}.special-difference{color:#a14a1f!important}.special-toolbar{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}.special-toolbar a{color:#23549d}button{cursor:pointer}.confirm-cash{display:flex;gap:10px;align-items:flex-start;margin:18px 0;line-height:1.6}.confirm-cash input{width:20px;height:20px;flex:none}dialog{width:min(94vw,760px);max-height:85vh;overflow:auto;border:1px solid #c8d8e9;border-radius:14px;padding:24px}dialog::backdrop{background:#18334f77}.dialog-actions{display:flex;gap:12px;margin-top:18px}.dialog-actions button{padding:12px 20px;border:1px solid #aebfd4;border-radius:8px;font:inherit}.dialog-actions button:last-child{background:#2054a3;color:white}.review-item{border-bottom:1px solid #dce5ef;padding:12px 0}.review-item p{margin:5px 0}.muted{color:#647991;font-size:15px}[hidden]{display:none!important}</style></head><body><main>
<header><a href="/m#pending">‹ 返回工作台</a><h1>老板特别处理</h1></header>
<p id="status" role="status">正在读取原单…</p><div class="special-toolbar"><a href="/simple-daily-close?view=reports">门店扎账报告 ›</a><a href="/daily-close?view=history">历史原单 ›</a><a href="/assistant?mode=store">工作助理 ›</a></div>
<form id="special-form" hidden><div id="rows"></div><label for="reason">处理说明</label><textarea id="reason" maxlength="500" required>旧期初现金尚未理顺，导致本次历史扎账复核遗留。经本人核对，当前门店现金准确，现结束这项旧复核任务。原始报数、原差额及操作记录全部保留，本次不调整现金、收付款或库存账。</textarea><label class="confirm-cash"><input id="cash-verified" type="checkbox" required><span>我已核对当前门店现金，确认无误，并同意按上述说明处理所选原单。</span></label><button id="preview" class="submit" type="submit">核对所选事项</button></form>
<dialog id="confirm-dialog"><h2>核对本次特别处理</h2><div id="details"></div><p id="confirm-reason"></p><p class="muted">所选旧复核任务结束后，原报数和差额保留；转为查看报告的单据继续保留店内核对。</p><p id="dialog-status" role="alert"></p><div class="dialog-actions"><button id="cancel" type="button">返回</button><button id="commit" type="button">确认处理所选事项</button></div></dialog>
</main></body></html>
