<!doctype html><html lang="zh-CN"><head><script defer src="/page-help.js?v=20261010-clean-layout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>聚友通信城 · 交班结算</title><link rel="stylesheet" href="/search.css?v=20261010-clean-layout"><link rel="stylesheet" href="/close.css?v=20261010-clean-layout"><link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout"><script src="/mobile-nav.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"></head><body>
<header><a href="/m">‹ 返回工作台</a><div><strong>交班结算</strong></div></header>
<main><p id="operator" class="operator-strip">正在确认交班员工…</p><section class="panel preview-panel"><h2>本班账面汇总</h2><div id="preview">正在读取…</div></section>
<section class="panel entry-panel"><h2>填写交班单 <button type="button" class="page-help-button" data-help-target="close-help">? 帮助</button></h2><template id="close-help" data-page-help-template="交班结算帮助"><h3>交班操作</h3><p>看账面 → 点现金 → 选交接人 → 提交。蓝色框内填写，红色标记为必填。现金请当面清点后录入。</p><p>下方填实际清点金额，系统自动比较。现金有差异时，请填写差异原因。</p><p>提交后保存本班收支快照，进入负责人待核对。新业务仍可继续开单。</p></template><form id="close-form" novalidate><div id="close-errors" class="validation-summary" role="alert" hidden></div><fieldset class="cash-zone"><legend>清点现金</legend><label><span>抽屉实点现金（元） <b class="required-tag">必填</b></span><input id="actualCash" name="actualCash" type="number" min="0" step="0.01" inputmode="decimal" placeholder="填实际数到的金额" required></label><p id="cash-difference" role="status">填写实点金额后自动核对差异</p></fieldset><fieldset class="receiver-zone"><legend>选择交接人</legend><label><span>交接给 <b class="required-tag">必填</b></span><select id="receiverId" name="receiverId" required><option value="">请选择交接人</option></select></label><label><span>交接说明 <b id="note-required" class="required-tag" hidden>有差异时必填</b></span><textarea id="close-note" name="note" rows="3" maxlength="500" placeholder="有现金差异，请说明原因；无差异可留空"></textarea></label></fieldset><p id="status" class="submit-feedback" role="alert" hidden></p><div class="submit"><button id="close-submit" type="submit" disabled>提交交班结算</button></div></form></section>
<section class="panel history-panel"><h2>交班结算记录</h2><div id="history">正在读取…</div></section></main><script src="/close.js?v=20261010-clean-layout" defer></script></body></html>
