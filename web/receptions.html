<!doctype html><html lang="zh-CN"><head><script defer src="/page-help.js?v=20261010-clean-layout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>聚友通信城 · 客户接待单</title><link rel="stylesheet" href="/search.css?v=20261010-clean-layout"><link rel="stylesheet" href="/receptions.css?v=20261011-two-columns"><script src="/submit-voice.js?v=20261010-clean-layout" defer></script><script src="/reception-profile.js?v=20261010-clean-layout" defer></script><script src="/receptions.js?v=20261011-store-optimization" defer></script><link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout"><script src="/mobile-nav.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"></head><body><header><a href="/m">‹ 返回工作台</a><div><strong>客户接待单</strong></div></header><main><section class="panel"><div class="row"><h2>登记接待</h2><button type="button" class="page-help-button" data-help-target="receptions-entry-help">? 帮助</button></div><p id="auth-notice" class="operation-tip" hidden>登录已失效。<a href="/login?next=/receptions">点这里用员工账号重新登录</a>。</p><form id="new-form" novalidate><p class="hint auto-info">接待员工：<strong id="reception-operator">登录账号自动记录</strong></p><div class="grid reception-first-fields"><label><span>手机号</span><input name="phone" type="tel" inputmode="numeric" pattern="1[3-9][0-9]{9}" maxlength="11" autocomplete="off" aria-describedby="reception-phone-feedback"></label><label><span>称呼</span><input name="name" maxlength="40"></label><label><span>来源</span><select name="source"><option>到店</option><option>老顾客</option><option>转介绍</option><option>地推</option><option>电话</option><option>微信</option><option>其他</option></select></label><label><span>来意</span><select name="purpose"><option value="咨询一般业务">一般咨询</option><option>咨询手机</option><option>购买手机</option><option>配件</option><option>维修</option><option>号卡</option><option>充值</option><option>宽带</option><option>套餐</option><option>售后</option><option>其他咨询</option></select></label><small id="reception-phone-feedback" class="form-feedback reception-first-feedback" role="status">无手机号不能关联交易。</small></div><div id="reception-errors" class="validation-summary" role="alert" hidden></div><div id="intake-fields"></div><p id="reception-progress" class="form-feedback" role="status"></p><p id="status" role="alert" aria-live="assertive"></p><div class="intake-actions"><button type="submit">建立接待单</button><button type="submit" value="convert" formnovalidate>先保存并转销售</button></div></form></section><section class="panel failure-panel"><details id="failure-records"><summary id="failure-summary" aria-controls="failed-attempts"><span>查看失败记录</span><span id="failure-count" class="failure-count" aria-live="polite">0条</span></summary><div class="failure-tools"><button id="refresh-attempts" type="button">刷新记录</button><button type="button" class="page-help-button" data-help-target="receptions-failures-help">? 帮助</button></div><div id="failed-attempts">暂无失败记录。</div></details></section><section class="panel"><div class="row"><h2>接待与待跟进</h2><button id="refresh" type="button">刷新</button></div><input id="filter" type="search" placeholder="手机号、需求、机型或住地"><div id="records">正在加载…</div></section><section class="panel"><div class="row"><h2>后续成交归属申请</h2><button type="button" class="page-help-button" data-help-target="receptions-claims-help">? 帮助</button></div><div id="claims">正在加载…</div></section><dialog id="entry-dialog"><form id="entry-form" novalidate><h2 id="entry-title"></h2><p id="entry-info"></p><div id="entry-fields"></div><p id="entry-error" class="error" role="alert"></p><div class="actions"><button type="button" id="cancel">取消</button><button type="submit">确认</button></div></form></dialog><dialog id="result-dialog" aria-labelledby="result-title"><h2 id="result-title"></h2><p id="result-detail"></p><p id="result-reference" class="hint"></p><button id="result-close" type="button">知道了</button></dialog></main><template id="receptions-entry-help" data-page-help-template="接待登记帮助"><p>接待 · 协助 · 转单 · 跟进 · 结案</p><p>成交或未成交均建单；顾客手机号用于识别同一顾客；没有手机号也可留底，但按无效接待核定基本积分，不能关联交易。积分须经负责人确认。</p><p>忙时可先转销售；缺少的信息标记待补，随后回到原接待单补充。</p><p>补充接待和顾客资料时，未了解到的可选待补；顾客描述不强制。</p></template><template id="receptions-failures-help" data-page-help-template="失败记录帮助"><p>失败记录保存手机号掩码、原因与提交人。网络中断时接待单可能已保存，先刷新核对；按原内容重试会核对原请求，避免重复建单。</p></template><template id="receptions-claims-help" data-page-help-template="后续成交归属帮助"><p>甲的早期接待 → 乙的后续成交</p><p>原接待与后续成交须属于同一顾客，贡献和积分由老板核定。</p></template><datalist id="reception-occupations"><option>学生</option><option>务农</option><option>个体经营</option><option>企业职员</option><option>机关事业单位</option><option>工人</option><option>退休</option><option>自由职业</option></datalist></body></html>
