<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>子女关怀</title><link rel="stylesheet" href="/family.css?v=20261011-family"><script defer src="/family.js?v=20261011-family"></script></head><body><header><h1>子女关怀</h1><button id="family-text" type="button">字＋</button></header><main><p id="status" role="status"></p><section id="register-panel" hidden><h2>家人邀请你来</h2><p id="invite-info"></p><form id="register-form"><label>你的姓名<input name="name" maxlength="40" required autocomplete="name"></label><label>独立登录密码（至少10位）<input name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label><label>再输一遍密码<input name="confirm" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label><button type="submit">注册，等家人确认</button></form></section><section id="login-panel"><h2>我的关怀账号</h2><p>这是独立账号，只用于与家人互动。</p><form id="login-form"><input name="loginRef" type="hidden"><label>我的关怀账号<input name="accountId" readonly autocomplete="username" placeholder="先打开家人邀请，或保存的登录链接"></label><label>密码<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label><button type="submit">登录</button></form><p>首次使用请让家人从个人助理发邀请。注册成功后，请保存注册后显示的登录链接，换手机时打开链接再输入密码。</p></section><section id="register-result" hidden><h2>已注册，等待家人确认</h2><p id="account-id"></p><label>请保存你的登录链接<textarea id="account-ref" readonly rows="3"></textarea></label><button id="copy-account" type="button">复制登录链接</button></section><section id="interaction" hidden><div class="actions"><h2 id="parent-name"></h2><button id="reload" type="button">刷新</button><button id="logout" type="button">退出</button></div><p id="delivery"></p><section id="shared-info" hidden><h3>家人愿意分享的近况</h3><div id="shared-content"></div></section><div id="messages" role="log" aria-label="亲友留言"></div><form id="message-form"><input type="hidden" name="replyTo"><p id="reply-label"></p><label>消息类型<select name="type"><option>留言</option><option>报平安</option><option>提醒建议</option></select></label><label>说点什么<textarea name="content" rows="3" maxlength="1000" required placeholder="问候家人，或告诉他你的近况"></textarea></label><div class="actions"><button type="submit">发送站内留言</button><button id="cancel-reply" type="button">取消回复</button></div></form><p>提醒是给家人的建议，由本人确认安排。这里未接通微信、短信或关闭页面后的推送；紧急情况请直接打电话。</p></section></main></body></html>
