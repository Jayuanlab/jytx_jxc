<!doctype html>
<html lang="zh-CN"><head><script defer src="/page-help.js?v=20261010-clean-layout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>知识审核与回答纠错</title><link rel="stylesheet" href="/knowledge.css?v=20261010-clean-layout"><script src="/knowledge-review.js?v=20261011-special-review" defer></script><style>.review-list{padding-left:1.4em}.review-list li{margin:.65em 0}.proof{border-left:4px solid #2f6bba;padding:12px;background:#eef5ff;margin:12px 0}.review-quote{white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid #cbd5e1;padding:10px;font-size:.95em}main{max-width:1100px}.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric-grid p{margin:0}.ref-label{color:#35639b;font-weight:700} .status-error{color:#a52b25} details{margin:10px 0}h2{font-size:1.2em}#answer-feedback{scroll-margin-top:100px}.feedback-item{border:1px solid #bad0ea;border-radius:12px;padding:12px;margin:12px 0;background:#f7faff;overflow-wrap:anywhere}.feedback-item summary{line-height:1.5}.feedback-item .original{white-space:pre-wrap;background:#f0f3f8;border-left:4px solid #92a5bc;padding:10px}.feedback-item .suggested{white-space:pre-wrap;background:#ebf7ed;padding:10px}.feedback-item input[type=checkbox]{display:inline-block;width:22px;height:22px;vertical-align:middle;margin-right:6px}.feedback-item form{border-top:1px solid #cbd9eb;margin-top:12px}.feedback-item textarea{background:#fff;min-height:100px}.feedback-item .correct-answer{border-color:#66a47b;background:#f1faf3}.feedback-item .review-message{white-space:pre-wrap}.feedback-item .review-message[data-error=true]{color:#a52b25}#feedback-review-status{color:#225c31}.feedback-item small{display:block;margin:8px 0}@media(max-width:640px){.feedback-item{padding:10px}.feedback-item button{width:100%}}</style><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"><link rel="stylesheet" href="/store-communication.css?v=20261011-special-review"><script defer src="/store-communication.js?v=20261011-special-review"></script><link rel="stylesheet" href="/mobile-nav.css?v=20261010-readable"><script defer src="/mobile-nav.js?v=20261010-clean-layout"></script></head><body><header><a href="/m">⌂ 首页</a><strong>知识审核</strong><a href="/knowledge">看知识库</a></header><main><section class="intro"><div class="row"><h1>知识审核</h1><button type="button" class="page-help-button" data-help-target="knowledge-review-help">? 帮助</button></div></section><section id="answer-feedback" class="tools" hidden>
<div class="row"><h2>回答纠错 <span id="feedback-pending"></span></h2><button id="feedback-reload" type="button">刷新</button></div>
<label for="feedback-filter">查看状态</label><select id="feedback-filter"><option>待审核</option><option>已生效</option><option>已处理</option><option>不采纳</option><option>全部</option></select>
<p id="feedback-review-status" role="status"></p><div id="feedback-list"></div><button id="feedback-more" type="button" hidden>加载更多</button>
</section><details class="tools"><summary>资料核对报告</summary><section class="tools" id="batch-tools" hidden><label for="review-batch">选择资料批次</label><select id="review-batch"></select></section><p id="review-status" role="status">正在加载…</p><div id="review-result"></div></details><template id="knowledge-review-help" data-page-help-template="资料核对与维护帮助"><p>回答纠错：员工可直接在助理原来的两个框修改问法和答法，点下方“提交审核”，只提交一次。老板在此核对问与答，一次确认一起生效；未确认前继续使用原问答。业务操作与实时账目也能在原框编辑并提交纠错，在此核对处理，不会改为固定账目答案。实时销售、库存、金额等问题保留真实数据查询，核对原因后填写处理结果。</p><p>原文件和原始数字保留。可确认的内容进入现行资料；有疑点的内容单独核实后再作为办理依据。</p><p>每批资料独立保存来源和整理报告。</p><p>分别核对写法冲突、版本差异、排版及缺少条件。资料里的删除、覆盖等说明不会直接执行。</p><p>顾客回答默认川渝话，可切换普通话。老板可在知识库修改常见问法、关键词组合和简短答复。多义方言结合上下文，不能强行替换。</p><h3>后续维护</h3><ol><li>进入知识库，按“待核实或历史资料”筛选。</li><li>涉及具体资费、资格和办理条件的，对照移动 BOSS 和对应原始资料补齐版本、适用人群及日期。</li><li>老板修改并核实后，将对应卡片改为“店内确认现行”。每次修订保留原文件出处和修改记录。</li></ol><p>话术供员工学习参考，未提供的条件不由助理猜补。导入资料不会改变库存、资费计算规则或财务交易。</p></template></main></body></html>
