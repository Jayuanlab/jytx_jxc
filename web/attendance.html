<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>考勤打卡 · 聚友通信城</title><link rel="stylesheet" href="/attendance.css"></head>
<body><main><header><a href="/m">‹ 返回工作台</a><h1>考勤打卡</h1><p id="identity">正在核对本人账号…</p></header>
<section class="card attendance-primary" aria-label="打卡操作"><div id="actions" class="actions" hidden><button id="checkin" type="button">店内签到</button><button id="fieldwork" type="button" class="primary">开始外勤</button><button id="checkpoint" type="button" hidden>外勤定位打卡</button><button id="end" type="button" hidden>结束外勤</button><button id="checkout" type="button" hidden>签退</button></div><p id="feedback" role="status" aria-live="polite"></p><a id="enter-workbench" href="/m">进入工作台 ›</a><p id="state" hidden></p><p id="enter-hint" hidden></p></section>
<section class="card" id="fieldwork-form" hidden><h2 id="fieldwork-title">外勤登记</h2><p id="fieldwork-context" hidden></p><label>村名或外勤地点<input id="location" maxlength="200" autocomplete="off" placeholder="村名或地点"></label><label>工作事项<textarea id="work-content" maxlength="1000" placeholder="填写工作事项"></textarea></label><div class="actions"><button id="submit-fieldwork" class="primary" type="button">确认开始外勤</button><button id="cancel-fieldwork" type="button">取消</button></div></section>
<section class="card"><h2>当日值班</h2><p id="schedule">正在读取排班…</p><ul id="schedule-list"></ul><button id="edit-schedule" type="button" hidden>安排或调整今日值班</button><form id="schedule-form" hidden><label>值班人<select name="userId" required></select></label><label>安排<select name="status"><option value="work">值班</option><option value="cancelled">撤销此人今日安排</option></select></label><label>岗位<select name="post"><option value="frontdesk">营业前台 · 计划现金保管</option><option value="mobile">手机柜台</option></select></label><div class="time-fields"><label>上班时间<input name="startTime" type="time" value="09:00" required></label><label>下班时间<input name="endTime" type="time" value="21:00" required></label></div><label class="check"><input name="closeoutSubmitter" type="checkbox">指定为当日扎账交接提交人</label><label>备注（选填）<input name="note" maxlength="200"></label><div class="actions"><button type="submit" class="primary">保存值班安排</button><button id="cancel-schedule" type="button">取消</button></div><p id="schedule-feedback" role="status"></p></form></section>
<div hidden><p id="live"></p><button id="refresh-news" type="button"></button><ul id="team-news"></ul></div></main><script src="/attendance.js" defer></script></body></html>
