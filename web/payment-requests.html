<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>付款申请</title><link rel="stylesheet" href="/payment-requests.css"></head><body><header><a href="/m">← 工作台</a><h1>付款申请</h1><a href="/app?tab=payments" id="ledger-link" hidden>正式付款单 →</a></header><main><div id="status" role="status"></div><section class="card" id="entry"><h2>登记已经付出的款</h2><p>营业员提交后由老板核对；老板确认前不会记入费用和付款流水。</p><form id="request-form"><div class="grid"><label>收款方<input name="counterparty" required maxlength="100" placeholder="如快递公司、搬运人"></label><label>金额（元）<input name="amount" type="number" min="0.01" step="0.01" required></label><label>实际付款日期<input name="date" type="date" required></label><label>实际付款账户<select name="paymentAccountId" required></select></label><label>付款流水号（选填）<input name="reference" maxlength="100"></label></div><label>付款事由<textarea name="note" required maxlength="500" placeholder="如运费、耗材、杂费"></textarea></label><label class="check"><input type="checkbox" name="confirmed" required>我确认这笔款已经实际付出</label><button class="primary" type="submit">提交老板确认</button></form></section><section class="card"><h2 id="list-title">付款申请记录</h2><div id="rows"></div></section></main><script src="/payment-requests.js" defer></script></body></html>
