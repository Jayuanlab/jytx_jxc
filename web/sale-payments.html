</style><script src="/sale-payments.js?v=20261028-search-r1" defer></script><link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout"><script src="/mobile-nav.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"></head><body><header><a href="/m">‹ 返回工作台</a><div><strong>销售收款核对</strong></div></header><main><template id="sale-payments-help" data-page-help-template="销售收款核对帮助"><p>应用内待办由本人确认，全程留痕。</p><p>开单不等待收款核对。非现金款先由经办营业员确认顾客已付款，再由账户持有人核对到账；未到账写原因退回营业员重查。只有到账确认才记入资金流水。现金由开单员工记录入抽屉情况，老板核对。</p></template><p id="message" role="status"></p><section class="payment-search"><label for="payment-search-input">查找收款单</label><div class="payment-search-row"><input id="payment-search-input" type="search" autocomplete="off" placeholder="输入 SK 收款单或 SO 销售单号" aria-controls="payment-search-options" aria-autocomplete="list"><button id="payment-search-clear" type="button">清除</button></div><div id="payment-search-options" class="payment-search-options" role="listbox" hidden></div><p class="hint">输入单号后可从下拉列表选择；只显示当前账号有权查看的单据。</p></section><section><h2>待我处理 <button type="button" class="page-help-button" data-help-target="sale-payments-help">? 帮助</button></h2><div id="pending">正在读取…</div></section><section id="boss-help" hidden><h2>营业员待处理 · 老板可代办本人账户收款</h2><p>营业员尚未提交的挂单也在此可见。确认款确实进入你的账户后，可由你代办并办结；其他账户仍由实际收款人确认。</p><div id="boss-help-list"></div></section><section><h2>已处理及我开的单</h2><div id="history"></div></section></main></body></html>
