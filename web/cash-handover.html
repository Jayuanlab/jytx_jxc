<html lang="zh-CN"><head><script defer src="/page-help.js?v=20261010-clean-layout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>聚友通信城 · 现金交接</title>
<link rel="stylesheet" href="/search.css?v=20261010-clean-layout"><link rel="stylesheet" href="/cash-handover.css?v=20261010-clean-layout"><link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout">
<script src="/mobile-nav.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/entry-feedback.css?v=20261010-clean-layout"><script src="/entry-feedback.js?v=20261010-clean-layout" defer></script><script src="/cash-handover.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"></head>
<body class="entry-page"><header><a href="/m">‹ 返回工作台</a><div><strong>现金交接</strong></div></header>
<main>
<section class="panel"><h2>提交一笔现金交接 <button type="button" class="page-help-button" data-help-target="cash-handover-help">? 帮助</button></h2><div class="entry-operator" id="entry-operator">正在读取操作员工…</div><template id="cash-handover-help" data-page-help-template="现金交接帮助"><h3>交出人提交，接收人本人确认</h3><p>营业员提交后只显示“待接收人确认”；对方在自己的员工账号确认实收，才算交接完成。这里不记录老板家庭的日常用款。</p></template>
<form id="create-form"><div class="grid"><label>交接去向<select name="kind" id="kind"><option value="person">交给指定接收人</option><option value="bank">存入老板银行卡</option></select></label><label><span>接收确认人 <b class="entry-required">必填</b></span><select name="recipientId" data-error="请选择接收确认人" id="recipient" required></select></label><label><span>交出金额（元） <b class="entry-required">必填</b></span><input name="amount" data-error="请填写交出金额，金额大于0且精确到分" type="number" min="0.01" step="0.01" inputmode="decimal" required></label><label>交接说明<input name="note" maxlength="500" placeholder="例如 10 月 7 日晚班现金"></label></div><div class="submit"><button type="submit">提交，等待对方确认</button></div></form><p id="status" role="status" hidden></p></section>
<section class="panel"><div class="row"><h2>待确认与历史交接</h2><button id="refresh" type="button">刷新</button></div><div id="history">正在读取…</div></section>
<details class="panel entry-failure-panel"><summary>最近提交失败记录</summary><p class="entry-hint">记录只保存在本标签页，可查看失败原因与重试结果。</p><div id="entry-failures"></div></details></main></body></html>
