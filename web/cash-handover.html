<!doctype html>
<html lang="zh-CN"><head><script defer src="/page-help.js?v=20261010-clean-layout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>聚友通信城 · 内转资金交接单</title>
<link rel="stylesheet" href="/search.css?v=20261010-clean-layout"><link rel="stylesheet" href="/cash-handover.css?v=20261010-clean-layout">
<link rel="stylesheet" href="/entry-feedback.css?v=20261010-clean-layout"><script src="/entry-feedback.js?v=20261010-clean-layout" defer></script><script src="/cash-handover.js?v=20261014-recipient-manager" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"><link rel="stylesheet" href="/funding-hub.css?v=20261024-r1"><script defer src="/funding-hub.js?v=20261024-r1"></script></head>
<body class="entry-page"><header><a href="/m">‹ 返回工作台</a><div><strong>内转资金交接单</strong></div></header>
<main>
<section class="panel"><h2>提交一笔内部交接 <button type="button" class="page-help-button" data-help-target="cash-handover-help">? 帮助</button></h2><p>门店现金归门店保管。交出人提交后，由接收人用本人账号确认收到，才计个人实收。</p><div class="entry-operator" id="entry-operator">正在读取操作员工…</div><template id="cash-handover-help" data-page-help-template="现金交接帮助"><h3>交出人提交，接收人本人确认</h3><p>营业员提交后只显示“待接收人确认”，不改变资金归属；对方用本人账号确认实收后，记录门店转出和个人接收。未收到可退回交出人重查。内部交接不重复计销售收入或费用。</p></template>
<form id="create-form"><div class="grid"><label>交接去向<select name="kind" id="kind"><option value="" selected>请选择内转去向</option><option value="store_cash_to_wechat">门店现金转门店微信</option><option value="store_wechat_to_cash">门店微信转门店现金</option><option value="customer_scan_for_cash">顾客扫码支付换现金</option><option value="person">交给指定接收人</option><option value="bank">现金转存老板银行</option></select></label><label><span>接收确认人 <b class="entry-required">必填</b></span><select name="recipientId" data-error="请选择接收确认人" id="recipient" required></select></label><label><span>交出金额（元） <b class="entry-required">必填</b></span><input name="amount" data-error="请填写交出金额，金额大于0且精确到分" type="number" min="0.01" step="0.01" inputmode="decimal" required></label><label id="scan-channel-field" hidden>扫码方式<select name="scanChannel"><option value="微信">微信扫码</option><option value="支付宝">支付宝扫码</option></select></label><label>交接说明<input name="note" maxlength="500" placeholder="例如 10 月 7 日晚班现金"></label></div><div class="submit"><button type="submit">提交，等待对方确认</button></div></form><p><a href="/topup-pairs">现金代充值：分别开收款单、付款单并关联号码 ›</a></p><p id="status" role="status" hidden></p></section>
<section id="recipient-manager" class="panel" hidden><h2>现金交接接收人管理</h2><p>全部人员都在下面；只为确实接收现金的人开启专项权限。接收人须用本人账号确认。</p><div id="recipient-roster"></div><form id="recipient-add"><h3>＋ 添加人员</h3><label>姓名<input name="name" maxlength="40" required></label><button type="submit">添加并允许接收现金</button></form><p><a href="/m">人员管理：设置独立登录账号或重置密码</a></p></section>
<section class="panel"><div class="row"><h2>待确认与历史交接</h2><button id="refresh" type="button">刷新</button></div><div id="history">正在读取…</div></section>
<details class="panel entry-failure-panel"><summary>最近提交失败记录</summary><p class="entry-hint">记录只保存在本标签页，可查看失败原因与重试结果。</p><div id="entry-failures"></div></details></main></body></html>
