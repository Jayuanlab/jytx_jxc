<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>销售资金待交与待核</title><link rel="stylesheet" href="/sale-fund-responsibility.css?v=20261018-v123"></head><body><header><a href="/m">← 工作台</a><h1>销售资金待交 / 待核</h1></header><main><p class="hint">现金归共用门店现金。原销售现金足额登记并有入柜凭证后，营业员责任显示为已清；仍由营业员暂存或凭证不足的继续待核。实际交给老板另走内部交接单。</p><div id="status" role="status" aria-live="polite"></div><div id="summary"></div><button id="refresh" type="button">刷新真实记录</button><nav id="employees" aria-label="经办人"></nav><div id="rows"></div><section><h2>现金交接依据</h2><p>现金已入门店抽屉与实际交给老板是两回事。内部交接须由实际接收人确认，不重复登记销售收入；原单和历史核对记录保留。</p><a href="/cash-handover">查看 / 办理真实现金交接</a><div id="handovers"></div></section></main><script defer src="/sale-fund-responsibility.js?v=20261025-shared-cash-v2"></script></body></html>
