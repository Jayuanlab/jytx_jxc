<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>移动酬金返还规则表</title><link rel="stylesheet" href="/carrier-commission-rules.css?v=20261028-product-commission-r1"><script defer src="/carrier-commission-rules.js?v=20261028-product-commission-r1"></script></head><body id="commission-rules-page"><header><a href="/carrier">‹ 移动业务</a><h1>酬金返还规则表</h1><button id="reload">刷新</button></header><main><p id="status" role="status"></p><section id="product-policy"><h2>按具体产品计算的酬金标准</h2><p>读取产品标准中…</p></section><section><div class="heading"><h2>其他业务的自定义规则</h2><button id="new" hidden>新增规则</button></div><div class="scroll"><table><thead><tr><th>业务</th><th>返还方式</th><th>首期</th><th>各期预计酬金</th><th>适用期间</th><th>版本／操作</th></tr></thead><tbody id="rules"></tbody></table></div></section><section id="editor" hidden><h2 id="edit-title">新增规则</h2><form id="form"><div class="grid"><label>业务类型<select name="typeId" required></select></label><label>业务细类<select name="subTypeId" required></select></label><label>返还方式<select name="kind"><option value="current">当月返还</option><option value="four">4个月返还</option><option value="seven">7个月返还</option></select></label><label id="start-field">首期月份<select name="startOffset"><option value="0">办理当月</option><option value="1">办理次月</option></select></label><label>生效日期<input name="effectiveFrom" type="date" required></label><label>截止日期（选填）<input name="effectiveTo" type="date"></label></div><div id="amounts" class="grid"></div><label>备注（选填）<input name="note" maxlength="500"></label><label class="check"><input name="active" type="checkbox" checked>启用</label><div class="actions"><button type="button" id="cancel">取消</button><button>保存规则</button></div><p id="form-status" role="status"></p></form></section><section><details><summary>旧单待补计划（保留，不自动处理）</summary><div id="pending"></div></details></section></main></body></html>
