<!doctype html>
<html lang="zh-CN"><head><script defer src="/page-help.js?v=20261011-photo-work"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>门店工作日志</title><link rel="stylesheet" href="/work-journal.css?v=20261011-photo-work"><link rel="stylesheet" href="/mobile-nav.css?v=20261011-photo-work"><script defer src="/work-journal.js?v=20261011-photo-work"></script><script defer src="/mobile-nav.js?v=20261011-photo-work"></script><link rel="stylesheet" href="/page-help.css?v=20261011-photo-work"></head>
<body><header><a href="/m">‹ 首页</a><strong>门店工作日志</strong><span id="who">确认身份中</span></header>
<main><section class="card"><h1>登记工作日志 <button type="button" class="page-help-button" data-help-target="journal-entry-help">? 帮助</button></h1><p data-page-explanation class="hint">由老板或指定负责人核定积分。未记录不能认定没有工作；积分不自动折成工资。</p>
<div class="actions"><a href="/duties">六时段值日</a><a href="/used-phones">二手机拍照评估与检查积分</a></div><form id="journal-form"><label>经办员工<span id="actor" class="fixed-value">登录账号自动记录</span></label><div class="fields"><label>工作事项<select name="type" required><option>拿快递</option><option>商品入库</option><option>整理柜台</option><option>商品陈列</option><option>清洁</option><option>客户回访</option><option>学习培训</option><option>市场拓展</option><option>设备检查</option><option>其他</option></select></label><label>发生时间（不改则记录现在）<input name="occurredAt" type="datetime-local"></label><label>关联单据类型<select id="reference-kind" name="referenceKind"><option value="">不关联</option><option value="reception">接待单</option><option value="sale">销售单</option><option value="purchase">入库单</option></select></label><label>关联单据<select id="reference-id" name="referenceId"><option value="">不关联</option></select></label></div>
<div class="fields"><label id="parcel-field" hidden>快递单号<input name="parcelNo" maxlength="80" placeholder="一张快递单只提交一次"></label><label>交给谁核定<select name="reviewerId" id="journal-reviewer"><option value="">老板核定</option></select></label></div><label>做了什么<textarea name="event" rows="3" minlength="5" maxlength="1000" required placeholder="例如：整理A仓华为柜台，核对了陈列和价格标签。"></textarea></label><label>处理结果<textarea name="result" rows="2" minlength="2" maxlength="1000" required placeholder="例如：已完成，发现两个价格标签需更换。"></textarea></label><label>依据或补充说明（选填）<textarea name="evidenceNote" rows="2" maxlength="1000" placeholder="可写相关单号、当时情况、见证人等。"></textarea></label><button class="primary" type="submit">提交工作日志</button></form><p id="submit-status" role="status" aria-live="polite"></p></section>
<section class="card"><div class="section-head"><h2>工作日志与积分</h2><button id="refresh" type="button">刷新</button></div><label>按状态筛选<select id="status-filter"><option value="">全部状态</option><option>待核定</option><option>已核定</option><option>未通过</option></select></label><p id="summary" class="hint"></p><div id="records">加载中…</div></section>
<dialog id="review-dialog"><form id="review-form"><h2>负责人核定积分</h2><p id="review-info"></p><label>核定结果<select name="approve"><option value="true">通过并核定积分</option><option value="false">未通过</option></select></label><label>核定积分<input name="points" type="number" min="0" step="1" value="50" required></label><label>核定意见<textarea name="note" maxlength="1000" rows="3" placeholder="未通过须说明原因。"></textarea></label><p class="hint">这里只核定积分。现金奖励须通过奖励申请确认及发放，不能在这里记为已支付。</p><p id="review-error" class="error" role="status"></p><div class="actions"><button id="review-cancel" type="button">取消</button><button class="primary" type="submit">确认核定</button></div></form></dialog>
<template id="journal-entry-help" data-page-help-template="工作日志与积分用法"><p>记下参与的事情和处理结果，可关联已存在的接待单或销售单，再提交给负责人核定积分。</p><p>现金奖励另走奖励申请；日志积分不自动折成工资。</p></template></main></body></html>
