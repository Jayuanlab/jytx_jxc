<!doctype html>
<html lang="zh-CN"><head><script defer src="/page-help.js?v=20261010-clean-layout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>聚友通信城 · 每日扎账</title>
<link rel="stylesheet" href="/search.css?v=20261010-clean-layout"><link rel="stylesheet" href="/daily-close.css?v=20261010-clean-layout"><link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout">
<script src="/mobile-nav.js?v=20261010-clean-layout" defer></script><script src="/daily-close.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"></head>
<body>
<header><a href="/m">‹ 返回工作台</a><div><strong>每日扎账</strong></div></header>
<main>
<section class="panel"><div class="row"><h2>今日账面日报 <button type="button" class="page-help-button" data-help-target="daily-summary-help">? 帮助</button></h2><button id="refresh" type="button">刷新</button></div><template id="daily-summary-help" data-page-help-template="每日扎账帮助"><p>自动汇总截至现在的业务；正式锁定须在次日由老板签认。临时交班仍可使用<a href="/close">交班结算</a>。</p><p>每日扎账包括日报、移动BOSS核对和双人复核。暂无正式扎账单时，临时交班记录仍在交班结算页。</p></template><div id="summary">正在读取…</div></section>
<section class="panel"><h2>移动BOSS七组核对 <button type="button" class="page-help-button" data-help-target="daily-metrics-help">? 帮助</button></h2><template id="daily-metrics-help" data-page-help-template="移动BOSS核对帮助"><p>左列是本店单据自动计算；右列照移动BOSS手填。旧业务缺少细类或空充期初时显示“待补数据”，不会当作零。</p><p>现金或移动BOSS有差异时，填写差异原因，再交给另一名营业员逐栏复核。</p></template><form id="daily-form">
<div id="metrics">正在准备核对项…</div>
<h2>现金与复核人</h2><div class="cash-grid"><label>现金期初（元）<input name="openingCash" id="openingCash" type="number" min="0" step="0.01" required></label><label>抽屉实点现金（元）<input name="actualCash" id="actualCash" type="number" min="0" step="0.01" required></label><label>交给谁复核<select name="reviewerId" id="reviewerId" required><option value="">请选择另一名营业员</option></select></label></div>
<p id="cash-preview" class="cash-preview"></p><label>差异原因／交接说明<textarea name="note" id="daily-note" maxlength="1000" placeholder="有差异时必须说明；可写移动BOSS截图来源"></textarea></label>
<div class="submit"><button id="submit-daily" type="submit">提交今日扎账，请另一人复核</button></div></form><p id="status" role="status"></p></section>
<section id="air-panel" class="panel" hidden><h2>空中充值台账 <button type="button" class="page-help-button" data-help-target="daily-air-help">? 帮助</button></h2><template id="daily-air-help" data-page-help-template="空中充值台账帮助"><p>首次期初由老板登记；之后记录平台充值或扣减流水。此台账金额不自动当作门店现金收付。</p><h3>平台充值入金</h3><p>例如实际转出 2000 元，移动BOSS增加 1996 元：两项金额和各自流水同时记录，差额 4 元单列待核。</p><h3>期初／平台余额校正</h3><p>余额校正不代表已经付款，也不自动生成营业收入；正常充值请使用双金额表单。</p></template><h3>平台充值入金</h3><form id="air-funding-form" class="cash-grid"><label>实际转出金额（元）<input name="paidAmount" type="number" min="0.01" step="0.01" required></label><label>平台实际入账（元）<input name="creditedAmount" type="number" min="0.01" step="0.01" required></label><label>转出方式<select name="method"><option>银行卡</option><option>微信</option><option>支付宝</option></select></label><label>转出流水号<input name="bankRef" maxlength="80" required></label><label>移动BOSS流水号<input name="platformRef" maxlength="80" required></label><label>备注<input name="note" maxlength="500"></label><button type="submit">登记实际转出与平台入账</button></form><h3>期初／平台余额校正</h3><form id="air-form" class="cash-grid"><label>变动类型<select name="kind"><option value="opening">期初余额</option><option value="increase">余额增加</option><option value="decrease">余额减少</option></select></label><label>金额（元）<input name="amount" type="number" min="0.01" step="0.01" required></label><label>移动BOSS流水号<input name="reference" required maxlength="80"></label><label>备注<input name="note" maxlength="500"></label><button type="submit">登记空充流水</button></form><div id="air-history"></div></section>
<section class="panel"><h2>待办与历史扎账单</h2><div id="history">正在读取…</div></section>
<dialog id="action-dialog"><form id="action-form"><h2 id="action-title">复核</h2><p id="action-info"></p><div id="action-checks"></div><label>处理意见／差异原因<textarea name="note" maxlength="1000"></textarea></label><div class="record-actions"><button type="button" id="action-cancel" class="secondary">取消</button><button type="submit">确认处理</button></div><p id="action-error" class="error-text"></p></form></dialog></main></body></html>
