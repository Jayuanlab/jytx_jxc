<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>助理对账 · 聚友通信</title><link rel="stylesheet" href="/assistant-finance.css?v=20261029-misclick-r1"><script defer src="/assistant-finance.js?v=20261029-misclick-r1"></script><script defer src="/mobile-nav.js?v=20261020-stable-r1"></script></head><body id="assistant-finance-root" class="assistant-finance-page"><header><a href="/funds">‹ 财务中心</a><h1>助理对账</h1><button id="print">打印报表</button></header><main><section class="toolbar"><label>营业日期<input type="date" id="date"></label><button id="refresh">生成报表</button></section><p role="status" id="status"></p><div id="report"></div><section class="card"><h2>门店现金实点</h2><form id="count-form"><label>全店门店现金实际现金（元）<input name="amount" type="number" min="0" step="0.01" required></label><button>提交我的实点</button><p id="count-result" class="action-feedback" role="status"></p></form><div id="counts"></div></section><section id="owner" hidden><section class="card"><h2>老板确认</h2><label>当日微信扫码实际净收款（元）<input id="wechat-actual" type="number" step="0.01"></label><p>核对本报表后确认实际收款；助理核销已匹配款项，清除已处理提醒。</p><button id="confirm">确认本报表并处理已核清事项</button><p id="confirmed-result" class="action-feedback" role="status"></p></section><details class="card"><summary>期初与已核清依据</summary><form id="reference-form"><label>现金期初（元）<input name="openingCash" type="number" min="0" step="0.01" required></label><label>已核清现金口径调整（元，可正可负）<input name="cashAdjustment" type="number" step="0.01" value="0"></label><label>已核清说明<textarea name="explanation" maxlength="1500"></textarea></label><label>来源与核对依据<textarea name="evidence" maxlength="1500" required></textarea></label><label>报表结存或已提供实点（选填）<input name="reportedClosing" type="number" min="0" step="0.01"></label><label>结存来源<select name="reportedClosingBasis"><option value="report">报表计算结存</option><option value="physical">老板已提供的实点</option></select></label><button>保存核对依据</button><p id="reference-result" class="action-feedback" role="status"></p></form></details></section><section class="card"><h2>确认记录</h2><div id="history"></div></section></main></body></html>
