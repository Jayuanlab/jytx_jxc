<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>门店微信充值申请</title><link rel="stylesheet" href="/funding-hub.css?v=20261024-r1"><script defer src="/funding-hub.js?v=20261024-r1"></script><script defer src="/store-wallet-funding.js?v=20261024-r1"></script></head><body><main class="funding-home"><p id="wallet-error" class="funding-error" role="alert"></p><section class="funding-panel" id="wallet-new"><h2>申请门店微信充值</h2><form id="wallet-funding-form"><label>充值金额（元）<input name="amount" type="number" min="0.01" step="0.01" required inputmode="decimal"></label><label>备注（选填）<input name="note" maxlength="300" placeholder="需要补充的说明"></label><button class="funding-primary">提交申请</button></form></section><section class="funding-panel"><div class="funding-toolbar"><h2>申请与到账记录</h2><button id="wallet-refresh" type="button">刷新</button></div><div id="wallet-rows">正在读取…</div></section></main><dialog class="funding-modal" id="wallet-dialog"><h2 id="wallet-dialog-title"></h2><p id="wallet-dialog-sub" class="funding-muted"></p><form id="wallet-action-form"><div id="wallet-fields"></div><p id="wallet-action-error" class="funding-error" role="alert"></p><footer><button type="button" id="wallet-close-dialog">取消</button><button type="submit" id="wallet-action-save">确认</button></footer></form></dialog></body></html>
