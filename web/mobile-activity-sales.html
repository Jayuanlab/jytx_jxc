<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>移动活动机销售</title><style>
:root{font:16px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#193451;background:#eef3f8}*{box-sizing:border-box}body{margin:0}input,select,button{font:inherit}.page{max-width:600px;min-height:100vh;margin:auto;background:#f8fafc;padding-bottom:35px}.head{padding:15px 18px;background:#fff;border-bottom:1px solid #d8e3ef}.head a{color:#2461ba;text-decoration:none;font-size:14px;font-weight:700}.head h1{font-size:24px;margin:6px 0 0}.card{margin:13px 16px;padding:17px;background:#fff;border:1px solid #dce5ef;border-radius:12px}.card h2{font-size:18px;margin:0 0 12px}.stack{display:grid;gap:12px}label{font-size:14px;font-weight:700;color:#324d6b}input,select{width:100%;min-height:47px;margin-top:5px;padding:9px 11px;border:1px solid #afc1d7;border-radius:8px;background:#fff;color:#193451}button{min-height:43px;padding:9px 13px;border:1px solid #2461ba;border-radius:8px;background:#2461ba;color:white;font-weight:700}button:disabled{opacity:.55}.secondary{background:#fff;color:#2461ba}.inline{display:flex;gap:8px;flex-wrap:wrap}.inline>*{flex:1}.hint{color:#627790;font-size:13px;margin:8px 0 0}.flow{padding:11px 13px;background:#f0f5fc;border-radius:8px;font-weight:750}.table{width:100%;border-collapse:collapse}.table td{padding:9px 3px;border-bottom:1px solid #e1e9f1}.table td:last-child{text-align:right}.strong{font-weight:800;background:#f0f5fc;color:#145398}.error{color:#b33131}.good{color:#067754}.record{border-top:1px solid #dce5ef;margin-top:13px;padding-top:13px}.record:first-child{border-top:0;margin-top:0;padding-top:0}.record h3{font-size:16px;margin:0 0 5px}.record p{margin:5px 0}.record a{color:#2458af;margin-right:8px}.small{font-size:13px;color:#60758d}[hidden]{display:none!important}
</style><script defer src="/mobile-activity-sales.js"></script></head><body><main class="page"><header class="head"><a href="/m">‹ 返回工作台</a><h1>移动活动机销售</h1></header><p id="status" class="card hint" role="status">正在读取现行业务与门店钱包…</p>
<form id="activity-form"><section class="card"><h2>1　选业务、选原有手机</h2><div class="stack"><label>业务名称<select name="businessName" id="business" required></select></label><button id="add-business" type="button" class="secondary" hidden>新增业务名称</button><label>手机串码<input name="serialNo" id="serial" inputmode="numeric" autocomplete="off" required placeholder="扫描库存手机串码"></label><label>移动公司应付和包金额／销售单金额（元）<input name="hebaoAmount" id="gross" type="number" inputmode="decimal" min="0.01" step="0.01" required></label><label>门店和包商户钱包<select name="hebaoAccountId" id="hebao-account" required></select></label><div class="flow">中国移动应付 → 门店和包商户钱包待到账</div></div><p class="hint">开单先记中国移动应收；老板凭和包真实到账流水核对后转已收。</p><button id="setup-hebao" type="button" class="secondary" hidden>老板启用门店和包商户钱包</button></section>
<section class="card"><h2>2　门店返用户</h2><label><input type="checkbox" id="has-return" checked style="width:auto;min-height:auto;margin:0"> 本单返用户</label><div id="return-fields" class="stack" style="margin-top:12px"><label>门店返用户金额（元）<input name="topupAmount" id="return-amount" type="number" inputmode="decimal" min="0.01" step="0.01"></label><label>用户手机号<input name="customerPhone" id="phone" type="tel" inputmode="numeric" maxlength="11"></label><label>返用户方式<select name="topupSource" id="return-source"><option value="wechat">门店微信扫码付给用户</option><option value="boss">空充BOSS直接充给用户</option></select></label><label id="wechat-account-label">门店微信钱包<select name="wechatAccountId" id="wechat-account"></select></label></div><p class="hint">返用户支出须凭真实付款或BOSS流水确认，不生成用户现金充值收款。</p></section>
<section class="card"><h2>3　销售单计算</h2><label id="rate-label" hidden>本单营业员提成比例（%，可改）<input name="commissionRate" id="rate" type="number" inputmode="decimal" min="0" max="100" step="0.01"></label><p class="hint">按原库存串码读取成本；税扣＝和包全额 × 2.5%，在本单毛利中扣一次。</p><button id="preview-button" type="button" class="secondary">读取库存并计算</button><div id="calculation" aria-live="polite"></div><button id="submit-button" type="submit">生成销售单与关联办理单</button></section></form>
<section class="card"><h2>已办活动机</h2><label>单号、串码或手机号<input id="query" type="search" placeholder="查询本人有权查看的原单"></label><button id="search" type="button" class="secondary">查询</button><div id="records" aria-live="polite"></div></section>
</main></body></html>
