<!doctype html><html lang="zh-CN"><head><script defer src="/page-help.js?v=20261010-clean-layout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>聚友通信城 · 商品二维码</title><link rel="stylesheet" href="/search.css?v=20261010-clean-layout"><link rel="stylesheet" href="/qr.css?v=20261011-label-6040"><script src="/jsQR.js?v=20261010-clean-layout" defer></script><script src="/qr.js?v=20261011-label-6040" defer></script><link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout"><script src="/mobile-nav.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"></head><body><header><a href="/m">‹ 返回工作台</a><div><strong>商品二维码</strong><small>无串码商品 · 一款一码 · 按数量出入库</small></div></header><main><section class="panel"><h2>扫码识别商品 <button type="button" class="page-help-button" data-help-target="qr-scan-help">? 帮助</button></h2><p data-page-explanation class="hint">扫码只选商品，不会自动扣库存。</p><form id="scan-form"><div class="scan-row"><input id="code" autocomplete="off" placeholder="扫描二维码或输入商品编号" required><button type="submit">查询</button><button type="button" id="camera">相机扫码</button></div></form><video id="preview" playsinline muted hidden></video><p id="status" role="status">请扫描商品标签。</p><div id="result"></div></section><section class="panel" id="label-panel" hidden><h2>二维码标签／补打 <button type="button" class="page-help-button" data-help-target="qr-label-help">? 帮助</button></h2><p class="hint">60×40 毫米标签 · 无串号实物商品自动有码 · 同款一码</p><input id="filter" placeholder="搜索名称或商品编号"><div id="products"></div><div class="print-actions"><button id="preview-labels" type="button">预览标签</button></div></section><section class="panel" id="label-preview" hidden><h2>标签预览</h2><p id="label-count"></p><div id="print-sheet"></div><div class="print-actions"><button id="print" type="button">打印／补打标签</button></div><p class="hint">补打不会新增商品或改变库存。电脑打印时选择标签打印机，纸张设为60×40毫米、缩放100%。</p></section><template id="qr-scan-help" data-page-help-template="扫码识别用法"><p>可使用手机相机、扫码枪，或手动输入商品编号。查询商品后核对数量，再加入本单。</p></template><template id="qr-label-help" data-page-help-template="商品标签用法"><p>入库时自动生成无串号实物商品的二维码，同款再次入库仍使用原码。也可在商品列表或入库记录中点“二维码／补打”，选择份数后预览。标签为60×40毫米，不含采购价；打印或补打均不会改变库存。</p></template></main></body></html>
