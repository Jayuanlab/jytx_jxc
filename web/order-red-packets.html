<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单据红包 · 聚友通信</title><link rel="stylesheet" href="/order-red-packets.css"><link rel="stylesheet" href="/order-red-packets-ui.css"><script defer src="/order-red-packets-ui.js"></script><script defer src="/order-red-packets.js"></script></head><body><main id="red-packets-main"><header class="red-packets-head"><div><h1>单据红包</h1><p>申请 → 管理员核定 → 实际支付后确认</p></div><a href="/app">返回工作台</a></header><p id="red-packets-who"></p><p class="red-packets-note">每笔红包关联真实单据。申请和核定不会付款，系统不代你转账。</p><p id="red-packets-error" role="alert"></p><section class="red-packets-card"><h2>从已生成的单据申请</h2><form id="red-packets-source-form"><label>单号 / 单据名称<input name="q" type="search" maxlength="100" placeholder="输入原单号或短单号"></label><button type="submit">查找单据</button></form><p id="red-packets-source-count"></p><div id="red-packets-sources"></div></section><section class="red-packets-card"><div class="red-packets-head"><h2 id="red-packets-title">我的红包记录</h2><button type="button" id="red-packets-refresh">刷新</button></div><label>筛选状态<select id="red-packets-status"><option value="">全部</option><option>待老板核定</option><option>已核定待支付</option><option>已支付</option><option>已驳回</option><option>已撤回</option></select></label><div id="red-packets-rows"></div></section></main></body></html>
