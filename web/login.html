<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聚友通信工作台</title>
<link rel="stylesheet" href="/login.css?v=20261027-attendance-entry">
<link rel="stylesheet" href="/login-refresh.css?v=20261027-attendance-entry">
<script src="/login.js?v=20261027-attendance-entry" defer></script>
</head>
<body class="account-page">
<main id="account-main">
<header class="workbench-header"><div class="brand"><div class="mark" aria-hidden="true">聚</div><strong>聚友通信城</strong></div></header>
<div class="entry-panel">
<p id="status-message" class="message" role="alert"></p><button id="retry-status" class="status-retry" type="button">刷新登录状态</button>
<section class="card session-card" id="session-panel" hidden><p id="signed-in"></p><div class="links"><a href="/attendance">查看值班与考勤</a><a id="session-return" href="/m">进入工作台</a><button type="button" id="logout">退出登录</button></div></section>
<section class="card" id="login-panel">
<h2>本人账号登录</h2>
<form id="login-form">
<label>登录账号<input name="username" autocomplete="username" required maxlength="32" placeholder="输入登录账号"></label>
<label>密码<div class="password-field"><input id="login-password" data-password-field name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="输入密码"><button type="button" data-password-toggle="login-password" aria-pressed="false" aria-label="显示或隐藏登录密码">显示</button></div></label>

<button type="submit">登录</button>
</form>

<p id="login-message" class="message" role="alert"></p>

</section>
</div>
<section class="card" id="admin-panel" hidden>
<h2>员工账号管理</h2><div class="admin-tools"><a href="/app?tab=staff">员工名单</a><button id="refresh-staff" type="button">刷新名单</button></div>
<form id="admin-form">
<label>员工<select name="userId" required></select></label>
<label>员工登录账号<input name="username" required maxlength="32" placeholder="可用员工姓名或自定名称"></label>
<label id="reset-warning" class="reset-warning" hidden><input id="confirm-reset" type="checkbox">我确认重置该员工密码，原密码和现有登录将失效。</label>
<button type="submit">创建员工账号</button>
</form>
<p id="admin-message" class="message" role="alert"></p>
<div id="issued" hidden><p>请把以下账号和密码私下交给员工：</p><p>账号：<strong id="issued-username"></strong></p><p>密码：<strong id="issued-password"></strong></p><div class="issued-actions"><button type="button" id="copy-issued">复制账号和密码</button><button type="button" id="hide-issued">收起密码</button></div></div>
</section>
<section class="card" id="account-panel" hidden>
<h2>修改我的账号和密码</h2>
<form id="self-form">
<label>登录账号<input name="username" autocomplete="username" required maxlength="32"></label>
<label id="old-password-label" hidden>原密码<div class="password-field"><input id="self-currentPassword" data-password-field name="currentPassword" type="password" autocomplete="current-password" maxlength="128"><button type="button" data-password-toggle="self-currentPassword" aria-pressed="false" aria-label="显示或隐藏原密码">显示</button></div></label>
<label>新密码<div class="password-field"><input id="self-password" data-password-field name="password" type="password" autocomplete="new-password" maxlength="128" required minlength="10"><button type="button" data-password-toggle="self-password" aria-pressed="false" aria-label="显示或隐藏新密码">显示</button></div></label>
<label>再输一次新密码<div class="password-field"><input id="self-repeat" data-password-field name="repeat" type="password" autocomplete="new-password" maxlength="128" required minlength="10"><button type="button" data-password-toggle="self-repeat" aria-pressed="false" aria-label="显示或隐藏再输一次新密码">显示</button></div></label>
<button type="submit">保存新的账号和密码</button>
</form>
<p id="self-message" class="message" role="alert"></p>
<div class="links"><a href="/m">返回工作台</a></div>
</section>

</main>
</body></html>
