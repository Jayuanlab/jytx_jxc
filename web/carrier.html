<!doctype html><html lang="zh-CN"><head><script defer src="/page-help.js?v=20261010-clean-layout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>聚友通信城 · 移动业务结算</title><link rel="stylesheet" href="/search.css?v=20261010-clean-layout"><link rel="stylesheet" href="/carrier.css?v=20261010-clean-layout"><script src="/carrier.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout"><script src="/mobile-nav.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"></head><body><header><a href="/m">‹ 返回工作台</a><div><strong>移动业务结算</strong><small>号卡 · 充值 · 宽带 · 套餐｜逐月核对</small></div></header><main><section class="panel"><h2>登记移动业务 <button type="button" class="page-help-button" data-help-target="carrier-entry-help">? 帮助</button></h2><p data-page-explanation class="hint">预计结算不等于已确认收入或实际到账。</p><form id="new-form"><div class="grid"><label>关联接待单<select name="receptionId" id="reception-select"><option value="">不关联</option></select></label><label>顾客手机号（关联接待必填）<input name="customerPhone" type="tel" inputmode="numeric" pattern="1[3-9][0-9]{9}" maxlength="11" autocomplete="off"></label><label>业务类型<select name="type" required><option value="card">号卡</option><option value="recharge">充值</option><option value="broadband">宽带</option><option value="package">套餐</option><option value="contract">设备绑合约</option></select></label><label>业务细类<select name="subType" id="subType" required></select></label><label id="recharge-amount-field" hidden>话费充值金额（元）<input name="transactionAmount" type="number" min="0.01" step="0.01"></label><label>办理日期<input name="serviceDate" type="date" required></label><label>移动系统业务编号<input name="externalOrderNo" required maxlength="80"></label><label>关联销售单号（如有）<input name="reference" maxlength="80"></label></div><h3>预计逐月结算金额（办理次月起，元）</h3><div class="grid"><label>结算月数<select id="months" name="months"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label></div><div id="amounts" class="month-grid"></div><label>备注<input name="note" maxlength="500"></label><div class="submit"><button type="submit">登记业务</button></div></form><p id="status" role="status"></p></section><section class="panel"><div class="row"><h2>逐月结算台账</h2><button id="refresh" type="button">刷新</button></div><div id="records">正在加载…</div></section><dialog id="entry-dialog"><form id="entry-form"><h2 id="entry-title"></h2><p id="entry-info"></p><label>金额（元）<input name="amount" type="number" min="0" step="0.01" required></label><label id="ref-label">凭证号<input name="referenceNo" required maxlength="80"></label><label id="account-label" hidden>收款账户<select name="account"><option>银行卡</option><option>微信</option><option>支付宝</option><option>现金</option></select></label><label>备注<input name="note" maxlength="500"></label><p id="entry-error" class="error"></p><div class="actions"><button type="button" id="cancel">取消</button><button type="submit">确认登记</button></div></form></dialog><template id="carrier-entry-help" data-page-help-template="登记移动业务"><p>先记录业务编号和次月至第六个月的预计结算。</p><p>预计逐月金额从办理次月开始填写。没有款项的月份填 0；选择最后一个结算月。</p><p>台账中的“移动确认”和“实际到账”分别登记结算单与到账凭证。</p></template></main></body></html>
