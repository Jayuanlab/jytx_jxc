<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>六时段值日与分工</title><link rel="stylesheet" href="/staff-tasks.css?v=20261011-photo-work"><script defer src="/photo-tools.js?v=20261011-photo-work"></script><script defer src="/duties.js?v=20261011-photo-work"></script></head><body class="staff-task-page"><header><a href="/m">‹ 首页</a><strong>值日与分工</strong><small id="who">确认身份中</small></header><main><section class="card"><div class="task-head"><h1>每天六个时段</h1><button id="refresh">刷新</button></div><div class="fields"><label class="wide-mobile">查看日期<input id="date" type="date"></label><div class="links wide-mobile"><a class="button" href="/work-journal">工作积分</a><a class="button" href="/used-phones">二手机评估</a></div></div><div id="slots" class="tabs" aria-label="选择值日时段"></div><p id="status" role="status" aria-live="polite"></p><p id="vision-status" class="hint"></p></section><section id="manager" class="card" hidden><details><summary>六时段与员工分工设置</summary><p class="hint">以下是可修改的试用时段。先选择员工、审核人和区域，再安排任务。</p><form id="schedule-form"><div id="slot-settings" class="slot-grid"></div><h2>分工模板</h2><div id="templates"></div><button id="add-template" type="button">＋ 新增区域分工</button><div class="actions"><button class="primary" type="submit">保存时段与分工</button></div></form></details><div class="actions"><button id="arrange" class="primary">按模板安排这一天</button></div><p class="hint">选择某个时段后只安排该时段；选择全部时段则安排全部。已有任务不会重复生成。</p></section><div id="tasks"></div><p class="footer-note">照片检查供负责人核实；审核通过后记积分，积分不自动折成工资。</p></main></body></html>
