<!doctype html><html lang="zh-CN"><head><script defer src="/page-help.js?v=20261010-clean-layout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>软件学习天地</title><link rel="stylesheet" href="/learning-hub.css?v=20261011-split"><script defer src="/learning-hub.js?v=20261011-split"></script><link rel="stylesheet" href="/search.css?v=20261010-clean-layout"><link rel="stylesheet" href="/receptions.css?v=20261010-clean-layout"><script src="/learning.js?v=20261011-special-review" defer></script><link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout"><script src="/mobile-nav.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"></head><body><header><a href="/m">‹ 返回工作台</a><div><strong>软件学习天地</strong></div></header><main><section class="panel learning-hub" aria-label="我的学习"><div id="learning-stats" class="learning-stats">正在加载积分…</div><div class="learning-links"><a href="/knowledge">业务知识与推销技巧</a><a href="/assistant?mode=store">问工作助理</a><a href="/knowledge-review#answer-feedback">问答纠错贡献</a><a href="/work-journal">工作日志与积分</a></div><details><summary>积分说明</summary><p>活跃天数根据近30天学习、工作日志和纠错提交计算。学习与贡献由老板审核核分；同一场景每天计一次提交，积分不直接折算工资。</p></details><h2>实战演练</h2><form id="practice-form"><label>练习场景<select id="practice-scene"></select></label><p id="practice-question"></p><label>你会怎么接话<textarea name="answer" minlength="10" maxlength="1000" rows="3" required></textarea></label><details><summary>看看练习要点</summary><ul id="practice-tips"></ul></details><label>复盘与改进<textarea name="reflection" minlength="10" maxlength="1000" rows="2" required></textarea></label><button type="submit">提交练习</button></form><p id="practice-status" role="status"></p><section id="contribution-review" hidden><h2>问答贡献核分</h2><div id="contribution-awards"></div></section></section><section class="panel"><div class="row"><h2>填写学习单</h2><button type="button" class="page-help-button" data-help-target="learning-entry-help">? 帮助</button></div><form id="new-form"><div class="grid"><label>参与事项<select name="type"><option>接待</option><option>销售</option><option>移动业务</option><option>交班</option><option>采购</option><option>盘点</option><option>售后</option><option>培训</option><option>其他</option></select></label><label>关联单据类型<select name="referenceKind" id="reference-kind"><option value="">不关联</option><option value="reception">接待单</option><option value="sale">销售单</option><option value="carrier">移动业务单</option><option value="closeout">当日中途扎账单</option></select></label><label>关联单据<select name="referenceId" id="reference-id"><option value="">请先选择单据类型</option></select></label></div><label>参与事件（必填，至少10字）<textarea name="event" minlength="10" maxlength="1000" required rows="3" placeholder="发生了什么，你负责哪一部分？"></textarea></label><label>学到的内容（必填，至少10字）<textarea name="learned" minlength="10" maxlength="1000" required rows="3" placeholder="新知识、流程、商品或顾客问题"></textarea></label><label>心得与改进（必填，至少10字）<textarea name="reflection" minlength="10" maxlength="1000" required rows="3" placeholder="下次遇到类似情况准备怎么做？"></textarea></label><button type="submit">提交学习单</button></form><p id="status" role="status"></p></section><section class="panel"><div class="row"><h2>学习记录</h2><button id="refresh" type="button">刷新</button></div><div id="records">正在加载…</div></section><dialog id="review-dialog"><form id="review-form"><h2>审核学习单</h2><p id="review-info"></p><label>审核结果<select name="approve"><option value="true">通过并给积分</option><option value="false">未通过</option></select></label><label>核定积分<input name="points" type="number" min="1" step="1" value="50" required></label><label>审核意见<textarea name="note" rows="2"></textarea></label><p id="review-error" class="error"></p><div class="actions"><button id="cancel" type="button">取消</button><button type="submit">确认审核</button></div></form></dialog><template id="learning-entry-help" data-page-help-template="学习单帮助"><p>参与事务 · 记录所学 · 老板核分</p><p>可随时提交，关联接待、销售、移动业务或交班单；积分由老板审核后生效，不直接计入工资。</p><p>参与事件、学到的内容、心得与改进均需填写，每项10至1000字。</p></template></main></body></html>
