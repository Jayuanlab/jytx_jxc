<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日现金收款清单 · 聚友通信</title><link rel="stylesheet" href="/daily-cash-receipts.css"><script defer src="/daily-cash-receipts.js"></script></head><body><header><a href="/daily-close">‹ 返回今日扎账</a><h1>每日现金收款清单</h1></header><main><form id="date-form"><label>营业日期<input id="cash-date" type="date" required></label><button type="submit">查询</button><button type="button" id="today">今天</button></form><p id="scope"></p><p id="error" role="alert"></p><section class="totals" aria-label="现金汇总"><article><span>收现笔数</span><strong id="count">—</strong></article><article><span>登记收现总额</span><strong id="received">—</strong></article><article><span>现金付出 / 退款</span><strong id="paid">—</strong></article><article><span>现金净变动</span><strong id="net">—</strong></article></section><p id="note" class="note"></p><section><h2>逐笔现金收款</h2><div id="incoming"></div></section><details id="outgoing-section"><summary>现金付出与退款</summary><div id="outgoing"></div></details><details id="corrections-section"><summary>原误记现金的更正留痕</summary><div id="corrections"></div></details></main></body></html>
