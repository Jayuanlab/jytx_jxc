<!doctype html><html lang="zh-CN"><head><script defer src="/page-help.js?v=20261010-clean-layout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>聚友通信城 · 顾客现金充值</title><link rel="stylesheet" href="/air-recharge.css?v=20261016-opening-flow-v72"><link rel="stylesheet" href="/mobile-nav.css?v=20261010-clean-layout"><script src="/mobile-nav.js?v=20261010-clean-layout" defer></script><link rel="stylesheet" href="/entry-feedback.css?v=20261010-clean-layout"><script src="/entry-feedback.js?v=20261010-clean-layout" defer></script><script src="/air-recharge.js?v=20261016-opening-flow-v72" defer></script><script src="/air-opening-drafts.js?v=20261016-opening-flow-v72" defer></script><link rel="stylesheet" href="/page-help.css?v=20261010-clean-layout"></head><body class="air-recharge-page entry-page">
<header><a href="/m">‹ 返回工作台</a><strong>顾客现金充值</strong><a href="/daily-close">空充台账 ↗</a></header><main>
<section class="intro"><strong id="balance">正在读取平台余额…</strong></section>
<section id="air-opening-panel" class="panel opening-setup"><div class="head"><h2 id="air-opening-title">先完成平台期初</h2><button id="air-opening-refresh" class="opening-secondary" type="button">刷新</button></div><p id="air-opening-guide">正在读取期初状态…</p><form id="air-opening-form" hidden><div class="grid"><label>期初起始日期<input name="businessDate" type="date" required></label><label>起始时点的余额（元）<input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></label></div><label>核对依据<input name="evidence" maxlength="500" minlength="4" required placeholder="例如：起始日期的BOSS余额核对记录"></label><button id="air-opening-submit" type="submit">提交老板确认</button></form><p id="air-opening-status" role="status" aria-live="polite"></p><div id="air-opening-list"></div></section>
<section class="panel"><h2>新建现金充值单 <button type="button" class="page-help-button" data-help-target="air-recharge-help">? 帮助</button></h2><template id="air-recharge-help" data-page-help-template="现金充值帮助"><h3>收现金，再扣平台</h3><p>每笔现金充值把顾客实收、移动BOSS扣减和平台流水写在同一张单上。顾客自己在手机上用微信充值，请留接待记录，不走门店现金与空充平台账。</p><p>填好顾客实付现金与移动BOSS实际扣减后，系统自动核对两笔金额；点清现金、核对平台扣减后再勾选确认。</p></template><div class="entry-operator" id="entry-operator">正在读取开单员工…</div><form id="form"><div class="grid">
<label><span>顾客手机号 <b class="entry-required">必填</b></span><input name="customerPhone" data-error="请填写正确的11位顾客手机号" type="tel" inputmode="numeric" pattern="1[3-9][0-9]{9}" maxlength="11" required placeholder="用于关联顾客与充值记录"></label>
<label>关联已有接待单（可选）<select name="receptionId" id="receptionId"><option value="">自动创建本次接待单</option></select></label>
<label><span>顾客实付现金（元） <b class="entry-required">必填</b></span><input name="cashReceived" data-error="请填写顾客实收现金，金额大于0且精确到分" type="number" min="0.01" step="0.01" inputmode="decimal" required></label>
<label><span>移动BOSS实际扣减（元） <b class="entry-required">必填</b></span><input name="debitAmount" data-error="请填写平台实际扣减，金额大于0且精确到分" type="number" min="0.01" step="0.01" inputmode="decimal" required></label>
<label><span>移动BOSS流水号 <b class="entry-required">必填</b></span><input name="platformRef" data-error="请填写移动BOSS流水号" maxlength="80" required></label>
<label>备注（可选）<input name="note" maxlength="500"></label></div>
<p id="amount-feedback" class="entry-guide" role="status" hidden></p><label class="confirm"><input name="cashConfirmed" data-error="请点清顾客现金、核对平台扣减后勾选确认" type="checkbox" required>我已当面点清并收到顾客现金，且核对移动BOSS扣减金额</label>
<label class="confirm"><input name="cashInVault" type="checkbox">入门店现金（未勾选挂本人名下）</label><button type="submit">确认并生成充值单</button></form><p id="status" role="status" hidden></p></section>
<section class="panel"><div class="head"><h2>充值单记录</h2><button id="refresh" type="button">刷新</button></div><div id="history">正在读取…</div></section>
<details class="panel entry-failure-panel"><summary>最近提交失败记录</summary><p class="entry-hint">记录只保存在本标签页，可查看失败原因与重试结果。</p><div id="entry-failures"></div></details></main></body></html>
