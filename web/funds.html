<section class="hero"><h1>财务中心 <button type="button" class="page-help-button" data-help-target="funds-help">? 帮助</button></h1><template id="funds-help" data-page-help-template="财务中心帮助"><h3>展示范围</h3><p>按单据串起顾客、营业员、老板、采购经手人、供应商、移动公司和国补平台。只展示门店业务有关的资金，不读取私人账单。</p><h3>应收应付与资金保管</h3><p>老板与采购经手人是门店款的经手或保管人；双方内部转款不自动列为门店收入、费用或供应商已付款。移动预计酬金与已确认应收分开显示。</p><h3>资金关系</h3><div class="relationships"><div>顾客 <b>→</b> 销售收款账户</div><div>老板／采购经手人 <b>→</b> 供应商</div><div>老板 <b>⇄</b> 采购经手人</div><div>双方 <b>→</b> 移动空充平台 <b>→</b> 顾客充值</div><div>移动公司／国补平台 <b>→</b> 到账账户</div><div>营业员 <b>→</b> 现金交接 <b>→</b> 接收人</div></div><p>旧单只有“微信／银行卡”等收款方式，没有账户持有人时，会标成“账户归属待核”。内部转款与现金交接不重复计算营业收入。</p><h3>登记门店相关转款</h3><p>只登记用于门店经营的转款。登记转出后，由实际收款人在本人员工账号确认；这笔转款不是销售收入，也不是支付给供应商。</p></template><div id="stats" class="stats">正在读取…</div></section>
<nav id="finance-views" class="finance-views" aria-label="财务工作区"><button type="button" data-finance-view="processing" aria-pressed="true">财务处理</button><button type="button" data-finance-view="accounts" aria-pressed="false">账户与挂账</button><button type="button" data-finance-view="history" aria-pressed="false">历史流水</button></nav>
<section id="finance-processing" class="panel" aria-label="财务处理"><h2>财务处理</h2><p role="status">正在读取待处理款项…</p></section>

<section id="finance-center" class="panel" hidden></section><section id="finance-daily" class="panel" hidden></section><details class="fc-legacy" hidden><summary>资金保管、转款及完整流水</summary><details id="fund-positions-fold" class="fc-fold"><summary>查看应收应付与资金保管汇总</summary><section class="panel"><div id="positions" class="positions">正在计算…</div></section></details>
<section class="panel"><h2>内部交接单（微信等） <button type="button" class="page-help-button" data-help-target="funds-help">? 帮助</button></h2>
<form id="transfer-form"><p class="hint">转出经办人：<strong id="transfer-operator">登录账号自动记录</strong></p><div class="grid"><label>转出账户<select name="sourceAccountId" id="transfer-source"><option value="">本人账户转出</option></select></label><label>收款人<select name="toId" id="toId" required><option value="">请选择</option></select></label>
<label>金额（元）<input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></label>
<label>转款方式<select name="method" required><option value="微信">微信</option><option value="银行卡">银行卡</option><option value="支付宝">支付宝</option></select></label>
<label>转出流水号<input name="reference" maxlength="80" required></label>
<label>用途<select name="purpose"><option>门店经营周转</option><option>订货货款</option><option>空充平台充值</option><option>其他门店经营事项</option></select></label>
<label>关联订货单（可选）<select name="relatedOrderId" id="relatedOrderId"><option value="">不关联订货</option></select></label></div>
<button type="submit">登记转出，等待收款人确认</button></form><p id="status" role="status"></p>
<details id="fund-transfer-records" class="fc-fold"><summary><strong>店内转款记录</strong><span id="fund-transfer-count"></span></summary><div id="transfers"></div></details></section>
<details id="fund-flow-details" class="fc-fold"><summary><strong>完整资金关系</strong><span id="fund-flow-count"></span></summary><section class="panel"><div class="head"><h2>全部门店资金关系</h2><button id="refresh" type="button">刷新</button></div>
<div class="filters"><input id="query" type="search" placeholder="搜单号、供货商、账户或流水号"><select id="type"><option value="">全部类型</option><option>资金流水</option><option>内部划转</option><option>现金交接</option><option>平台余额</option></select></div>
<div id="flow-list">正在读取…</div></section></details>
